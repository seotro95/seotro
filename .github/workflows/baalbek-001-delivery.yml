name: Deliver Baalbek 001 production kit
on:
  push:
    branches: [codex/baalbek-001-20m42s]
    paths: ['episodes/baalbek-001/**', '.github/workflows/baalbek-001-delivery.yml']
permissions:
  contents: write
concurrency:
  group: baalbek-001-delivery
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out reviewed text and manifest
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: episodes/baalbek-001
      - name: Check out temporary synthetic-audio transfer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 576ed1c3f4656597c9c9207bb20c10a4bc72eb70
          path: _baalbek_parts
          persist-credentials: false
      - name: Verify files and save draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python episodes/baalbek-001/publish_release.py
          --parts _baalbek_parts
          --manifest episodes/baalbek-001/GITHUB_TRANSFER_MANIFEST.json
          --out _baalbek_release
