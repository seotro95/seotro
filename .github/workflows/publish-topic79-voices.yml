name: Publish requested topic79 voices and saved profiles
on:
  push:
    branches: [codex/topic79-prehistoric-nets-22m42s]
    paths: ['deliveries/topic79_voices/VOICE_EXPORT_READY.json']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /deliveries/topic79_voices/
      - name: Verify and upload completed narration files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python deliveries/topic79_voices/publish_voices.py
