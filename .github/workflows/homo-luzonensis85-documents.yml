    branches: [codex/homo-luzonensis85-production-20261113]
    paths: [.github/workflows/homo-luzonensis85-documents.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
