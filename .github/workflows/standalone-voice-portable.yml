name: Build Standalone Voice Portable

on:
  workflow_dispatch:
  push:
    branches:
      - codex/voice-studio-standalone-download
    paths:
      - .github/workflows/standalone-voice-portable.yml
      - voice-studio-standalone/**

permissions:
  contents: write

concurrency:
  group: standalone-voice-portable-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  HF_HUB_DISABLE_XET: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Install pinned CPU voice dependencies
        run: python -m pip install -r voice-studio-standalone/requirements-dev.txt
      - name: Prepare verified FFmpeg for regression checks
        working-directory: voice-studio-standalone
        shell: pwsh
        run: |
          python -c "import bootstrap; bootstrap.ensure_ffmpeg()"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path "tools/ffmpeg/bin/ffmpeg.exe") {
            Add-Content -Path $env:GITHUB_PATH -Value "$PWD/tools/ffmpeg/bin"
          }
      - name: Check dependencies
        run: python -m pip check
      - name: Run application and CPU worker regression checks
        working-directory: voice-studio-standalone/app
        run: python -m pytest -q tests
      - name: Run installer trust checks
        working-directory: voice-studio-standalone
        run: python -m pytest -q tests packaging/tests
      - name: Build and test native relocated offline package
        run: python voice-studio-standalone/packaging/build_windows.py --output "${{ runner.temp }}/portable/Voice-Studio-Rieng-Portable"
      - name: Upload verified ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Voice-Studio-Rieng-1.2.0-Portable-Windows-x64
          path: |
            ${{ runner.temp }}/portable/Voice-Studio-Rieng-1.2.0-Portable-Windows-x64.zip
            ${{ runner.temp }}/portable/Voice-Studio-Rieng-1.2.0-Portable-Windows-x64.zip.sha256
          compression-level: 0
          retention-days: 14
      - name: Publish tested portable download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "voice-standalone-portable-${{ github.run_id }}"
          @"
          Voice Studio Rieng Portable 1.2.0 - Windows 10/11 x64.

          Extract ALL files and open MO_TOOL.bat. No Python, FFmpeg, dependency installation or model download is required.
          Includes Windows Python 3.12, FFmpeg, Nano Vietnamese presets and cloning, Turbo Vietnamese voices/cloning, and 16 Piper country voices.
          The package passed native Windows relocated-interpreter, offline real synthesis, cloning, export and launcher checks before publication.
          Piper international preset voices run offline on CPU. Vietnamese clones default to Nano 4 steps. International Qwen cloning models are not bundled. Speed and clone fidelity depend on hardware, settings and reference audio.
          Source commit: ${{ github.sha }}
          "@ | Set-Content -Encoding utf8 "${{ runner.temp }}/portable-release-notes.txt"
          gh release create $tag "${{ runner.temp }}/portable/Voice-Studio-Rieng-1.2.0-Portable-Windows-x64.zip" "${{ runner.temp }}/portable/Voice-Studio-Rieng-1.2.0-Portable-Windows-x64.zip.sha256" --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Voice Studio Rieng Portable 1.2.0 - Extract and run" --notes-file "${{ runner.temp }}/portable-release-notes.txt" --latest=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
