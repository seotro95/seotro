name: Sky 536 MOI053 publish verify and archive sixteen voices
on:
  push:
    branches: [codex/sky536-moi053-production-20261120]
    paths: [.github/workflows/sky536-moi053-final-delivery.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: sky536-moi053
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python sky536-moi053/extract_content.py
          python sky536-moi053/extract_voice_inputs.py
          python sky536-moi053/build_documents.py
          python sky536-moi053/voice_gate.py
          python -m pip install imageio-ffmpeg==0.6.0
          python sky536-moi053/ensure_ffmpeg.py
          python -u sky536-moi053/wait_for_sources.py
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: sky536-moi053-voice-*
          path: voice_artifacts
          merge-multiple: false
          run-id: 44763939449
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: sky536-moi053-voice-en-US
          path: voice_artifacts/sky536-moi053-voice-en-US
          run-id: 44810226775
          github-token: ${{ github.token }}
      - name: Decode and publish all sixteen complete voices
        run: python -u sky536-moi053/publish_voices.py
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: sky536-moi053-final-release-reports
          path: |
            sky536-moi053/voice_delivery/*.json
            sky536-moi053/voice_delivery/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
  verify_and_archive:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/sky536-moi053-production-20261120
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python sky536-moi053/extract_content.py
          python sky536-moi053/extract_voice_inputs.py
          python sky536-moi053/build_documents.py
          python sky536-moi053/voice_gate.py
          python -m pip install imageio-ffmpeg==0.6.0
          python -u sky536-moi053/verify_and_archive.py
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky536-moi053-public-verification
          path: |
            sky536-moi053/PUBLIC_DELIVERY_QA.json
            sky536-moi053/GITHUB_ASSET_AUDIT.json
          if-no-files-found: ignore
          retention-days: 30
