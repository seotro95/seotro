name: Baishiya08 - English preview and full1340seconds
on:
  workflow_dispatch:
  push:
    branches: [codex/baishiya-voice-build-20261110]
    paths: [.github/workflows/baishiya-english08.yml]
permissions:
  contents: read
  actions: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install edge-tts==7.3.1
      - name: Verify expressive first30seconds before full synthesis
        run: python -u scripts/job_init.py en-US preview
      - uses: actions/upload-artifact@v4
        with:
          name: bs08-expressive-preview-30s
          path: build/voice/audio/en-US
          retention-days: 7
  english:
    needs: preview
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install edge-tts==7.3.1
      - name: Restore English checkpoint on retry
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          name: bs08-checkpoint-en-US
          path: build/voice/audio/en-US
      - name: Render English134 ten-second cues
        run: python -u scripts/job_init.py en-US full
      - name: Preserve recoverable English pieces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bs08-checkpoint-en-US
          overwrite: true
          path: |
            build/voice/audio/en-US/raw-*.wav
            build/voice/audio/en-US/raw-*.json
            build/voice/audio/en-US/raw-*.jsonl
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: bs08-voice-en-US
          path: |
            build/voice/audio/en-US/BAISHIYA_08_*.mp3
            build/voice/audio/en-US/render_report.json
            build/voice/audio/en-US/subtitles.srt
          if-no-files-found: error
          retention-days: 7
