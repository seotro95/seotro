name: Export completed topic29 audio
on:
  push:
    branches: [codex/topic29-audio-delivery]
    paths: ['deliveries/topic29/EXPORT_READY.json']
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /deliveries/topic29/
      - name: Verify and publish existing completed audio files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python deliveries/topic29/publish_export.py
