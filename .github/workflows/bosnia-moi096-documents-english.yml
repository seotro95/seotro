name: Bosnia MOI096 documents and English 20m42s
on:
  push:
    branches: [codex/bosnia-moi096-production-20261121]
    paths: [bosnia-moi096/TRIGGER_DOCUMENTS_ENGLISH]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  documents:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: bosnia-moi096
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python bosnia-moi096/extract_content.py
          python bosnia-moi096/build_documents.py
          python -u bosnia-moi096/publish_documents.py
        env:
          GH_TOKEN: ${{ github.token }}
  english:
    needs: documents
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: bosnia-moi096
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python bosnia-moi096/extract_content.py
          python bosnia-moi096/build_documents.py
          python bosnia-moi096/english_gate.py
          python -m pip install imageio-ffmpeg==0.6.0 edge-tts==7.3.1
          python bosnia-moi096/ensure_ffmpeg.py
          python bosnia-moi096/bootstrap_tool.py online
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: bosnia-moi096-checkpoint-en-US
          path: bosnia-moi096/voice/audio/en-US
      - name: Generate English with same Andrew voice and retain completed speech
        run: |
          set +e
          python -u bosnia-moi096/render_english_groups.py
          code=$?
          if [ "$code" = 75 ]; then
            sleep 15
            python -u bosnia-moi096/render_english_groups.py
            code=$?
          fi
          exit "$code"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bosnia-moi096-checkpoint-en-US
          path: |
            bosnia-moi096/voice/audio/en-US/group-*
            bosnia-moi096/voice/audio/en-US/raw-*
            bosnia-moi096/voice/audio/en-US/fallback-*
            bosnia-moi096/voice/audio/en-US/pending_*.json
          if-no-files-found: ignore
          retention-days: 30
          overwrite: true
      - uses: actions/upload-artifact@v4
        with:
          name: bosnia-moi096-voice-en-US
          path: |
            bosnia-moi096/voice/audio/en-US/*.mp3
            bosnia-moi096/voice/audio/en-US/render_report.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true
      - name: Publish complete English narration
        run: gh release upload bosnia-moi-096-20m42s bosnia-moi096/voice/audio/en-US/*.mp3 --repo seotro95/seotro --clobber
        env:
          GH_TOKEN: ${{ github.token }}

