name: AlUla 095 final delivery metadata
on:
  push:
    branches: ["codex/alula-095-20m42s"]
    paths: ["episodes/alula-095/**", ".github/workflows/alula-095-delivery.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify server digests and refresh final document links
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ALULA_METADATA_ONLY: "1"
        run: python episodes/alula-095/finish_audio_delivery.py
