name: AlUla 095 verified audio delivery
on:
  push:
    branches: ["codex/alula-095-20m42s"]
    paths: ["episodes/alula-095/**", ".github/workflows/alula-095-delivery.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify and save the 17 synthetic narration files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python episodes/alula-095/finish_audio_delivery.py
