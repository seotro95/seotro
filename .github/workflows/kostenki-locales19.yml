name: Kostenki19 fifteen localized male voices and17voice delivery
on:
  workflow_dispatch:
  push:
    branches: [codex/kostenki-voice-build-20261111]
    paths: [.github/workflows/kostenki-locales19.yml]
permissions:
  contents: read
  actions: read
jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        locale: [vi-VN, es-ES, fr-FR, ja-JP, ko-KR, de-DE, it-IT, pt-PT, nl-NL, pl-PL, sv-SE, da-DK, fi-FI, nb-NO, cs-CZ]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            input
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install edge-tts==7.3.1
      - name: Restore recoverable localized checkpoint
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          name: k19-checkpoint-${{ matrix.locale }}
          path: build/voice/audio/${{ matrix.locale }}
      - name: Render localized narration with locked male voiceID
        env:
          TTS_CHUNK_LIMIT: '480'
          TTS_LOCALE_WORKERS: '2'
        run: python -u scripts/job_init.py ${{ matrix.locale }} full
      - name: Preserve partial work for a failed-locale retry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k19-checkpoint-${{ matrix.locale }}
          overwrite: true
          path: |
            build/voice/audio/${{ matrix.locale }}/raw-*.wav
            build/voice/audio/${{ matrix.locale }}/raw-*.json
            build/voice/audio/${{ matrix.locale }}/raw-*.jsonl
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: k19-voice-${{ matrix.locale }}
          path: |
            build/voice/audio/${{ matrix.locale }}/KOSTENKI_19_*.mp3
            build/voice/audio/${{ matrix.locale }}/render_report.json
            build/voice/audio/${{ matrix.locale }}/subtitles.srt
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: voices
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            input
      - uses: actions/download-artifact@v4
        with:
          pattern: k19-voice-*
          path: artifacts
      - name: Reuse verified mainEnglish1215seconds
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '42877199490'
          name: k19-voice-en-US
          path: artifacts/k19-voice-en-US
      - name: Verify all17 and publish separate country-named voices
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u scripts/publish_voices_job.py
