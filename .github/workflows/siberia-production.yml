name: Render aligned Siberia narration
on:
  push:
    branches: [codex/siberia-2536-production]
    paths:
      - 'siberia-production/voices/*.srt'
      - '.github/workflows/siberia-production.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      languages: ${{ steps.languages.outputs.languages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: languages
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,json,subprocess
          allowed={'en','vi','es','fr','ja','ko','de','it','pt','nl','pl','sv','da','fi','no','cs','hi'}
          before=os.environ.get('BEFORE','')
          files=[]
          if before and set(before)!={'0'}:
              result=subprocess.run(['git','diff','--name-only',before,'HEAD'],capture_output=True,text=True)
              if not result.returncode:files=result.stdout.splitlines()
          candidates=[Path(f).stem for f in files if f.startswith('siberia-production/voices/') and f.endswith('.srt')]
          if not candidates:candidates=[p.stem for p in Path('siberia-production/voices').glob('*.srt')]
          langs=sorted(set(candidates)&allowed)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('languages='+json.dumps(langs)+'\n')
          print('Tracks:',langs)
          PY
  render:
    needs: plan
    if: needs.plan.outputs.languages != '[]'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        language: ${{ fromJSON(needs.plan.outputs.languages) }}
    concurrency:
      group: siberia-narration-${{ matrix.language }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 4f4fa1d72d976d6e2b9c94f906b0e12c6a2cf043
          path: melo-source
          sparse-checkout: melo-viet-local
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: melo-source/melo-viet-local/fast-lock.txt
      - run: |
          python siberia-production/install_ffmpeg.py
          python -m pip install --disable-pip-version-check -r melo-source/melo-viet-local/fast-lock.txt
      - name: Render, measure and upload owner-visible draft files
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUTF8: '1'
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '2'
        run: python siberia-production/render_voice.py '${{ matrix.language }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: siberia-voice-${{ matrix.language }}
          path: rendered/${{ matrix.language }}/
          retention-days: 7
          if-no-files-found: ignore
