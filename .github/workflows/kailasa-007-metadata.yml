name: Finalize Kailasa 007 release title
on:
  push:
    branches: [codex/kailasa-007-22m32s]
    paths: ['.github/workflows/kailasa-007-metadata.yml']
permissions:
  contents: write
jobs:
  title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify this draft and set episode 007 title
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          assert repo == 'seotro95/seotro'
          url = 'https://api.github.com/repos/' + repo + '/releases/447548313'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=60) as response:
              release = json.load(response)
          assert release['draft'] and release['tag_name'] == 'kailasa-007-22m32s'
          name = 'Kailasa 007 — 22:32 | 136 prompts | 16 male voices'
          payload = json.dumps({'name': name}).encode()
          with urllib.request.urlopen(urllib.request.Request(url, data=payload, headers={**headers, 'Content-Type': 'application/json'}, method='PATCH'), timeout=60) as response:
              updated = json.load(response)
          assert updated['id'] == release['id'] and updated['draft'] and updated['name'] == name
          print(updated['id'], updated['name'])
          PY
