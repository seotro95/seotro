name: Neanderthal fire71 full17 voices NamMinh and Hmong
'on':
  push:
    branches:
    - codex/neanderthal-fire71-production-20261112
    paths:
    - .github/workflows/neanderthal-fire71-voices.yml
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - &id001
      uses: actions/checkout@v4
      with:
        sparse-checkout: episode71
    - &id002
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - &id003
      run: python episode71/extract_inputs.py
    - uses: actions/download-artifact@v4
      with:
        name: fire71-english-preflight
        path: preflight_english
        run-id: 43237046060
        github-token: ${{ github.token }}
    - uses: actions/download-artifact@v4
      with:
        name: fire71-namminh-preflight
        path: preflight_namminh
        run-id: 43237046060
        github-token: ${{ github.token }}
    - run: python episode71/preflight71.py
    - uses: actions/upload-artifact@v4
      with:
        name: fire71-input-preflight
        path: episode71/VOICE_PREFLIGHT_QA.json
        if-no-files-found: error
        retention-days: 14
        overwrite: true
  english:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
    - *id001
    - *id002
    - *id003
    - run: 'python -m pip install imageio-ffmpeg==0.6.0 edge-tts==7.3.1

        python episode71/ensure_ffmpeg.py'
    - run: python episode71/bootstrap_tool.py online
    - uses: actions/download-artifact@v4
      with:
        name: fire71-english-preflight
        path: episode71/voice/audio/en-US
        run-id: 43237046060
        github-token: ${{ github.token }}
    - uses: actions/download-artifact@v4
      with:
        name: fire71-checkpoint-en-US
        path: episode71/voice/audio/en-US
      continue-on-error: true
    - name: Generate narration and retain successful parts
      shell: bash
      run: "set +e\npython -u episode71/render_english_groups.py\ncode=$?\nif [ \"\
        $code\" = 75 ]; then\n  sleep 30\n  python -u episode71/render_english_groups.py\n\
        \  code=$?\nfi\nexit \"$code\""
    - uses: actions/upload-artifact@v4
      with:
        name: fire71-checkpoint-en-US
        path: 'episode71/voice/audio/en-US/group-*

          episode71/voice/audio/en-US/raw-*

          episode71/voice/audio/en-US/pending_*.json'
        if-no-files-found: ignore
        retention-days: 14
        overwrite: true
      if: always()
    - uses: actions/upload-artifact@v4
      with:
        name: fire71-voice-en-US
        path: 'episode71/voice/audio/en-US/*.mp3

          episode71/voice/audio/en-US/render_report.json'
        if-no-files-found: error
        retention-days: 14
        overwrite: true
  online:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        locale:
        - vi-VN
        - es-ES
        - fr-FR
        - ja-JP
        - ko-KR
        - de-DE
        - it-IT
        - pt-PT
        - nl-NL
        - pl-PL
        - sv-SE
        - da-DK
        - fi-FI
        - nb-NO
        - cs-CZ
    steps:
    - *id001
    - *id002
    - *id003
    - run: 'python -m pip install imageio-ffmpeg==0.6.0 edge-tts==7.3.1

        python episode71/ensure_ffmpeg.py'
    - run: python episode71/bootstrap_tool.py online
    - uses: actions/download-artifact@v4
      with:
        name: fire71-checkpoint-${{ matrix.locale }}
        path: episode71/voice/audio/${{ matrix.locale }}
      continue-on-error: true
    - name: Generate narration and retain successful parts
      shell: bash
      run: "set +e\npython -u episode71/render_online.py \"${{ matrix.locale }}\"\n\
        code=$?\nif [ \"$code\" = 75 ]; then\n  sleep 30\n  python -u episode71/render_online.py\
        \ \"${{ matrix.locale }}\"\n  code=$?\nfi\nexit \"$code\""
    - uses: actions/upload-artifact@v4
      with:
        name: fire71-checkpoint-${{ matrix.locale }}
        path: 'episode71/voice/audio/${{ matrix.locale }}/raw-*

          episode71/voice/audio/${{ matrix.locale }}/pending_*.json'
        if-no-files-found: ignore
        retention-days: 14
        overwrite: true
      if: always()
    - uses: actions/upload-artifact@v4
      with:
        name: fire71-voice-${{ matrix.locale }}
        path: 'episode71/voice/audio/${{ matrix.locale }}/*.mp3

          episode71/voice/audio/${{ matrix.locale }}/render_report.json'
        if-no-files-found: error
        retention-days: 14
        overwrite: true
  hmong:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard:
        - 0
        - 1
    steps:
    - *id001
    - *id002
    - *id003
    - run: 'python -m pip install torch==2.8.0+cpu --index-url https://download.pytorch.org/whl/cpu

        python -m pip install imageio-ffmpeg==0.6.0 numpy==2.2.6 soundfile==0.13.1
        scipy==1.15.3 librosa==0.11.0 soxr==1.0.0

        python episode71/ensure_ffmpeg.py'
    - run: python -u episode71/bootstrap_tool.py hmong
    - uses: actions/download-artifact@v4
      with:
        name: fire71-checkpoint-hmong-${{ matrix.shard }}
        path: episode71/voice/audio/mww
      continue-on-error: true
    - run: python -u episode71/render_hmong.py "${{ matrix.shard }}"
    - uses: actions/upload-artifact@v4
      with:
        name: fire71-checkpoint-hmong-${{ matrix.shard }}
        path: episode71/voice/audio/mww/raw-*
        if-no-files-found: ignore
        retention-days: 14
        overwrite: true
      if: always()
  native_final:
    needs:
    - hmong
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
        - locale: mww
          backend: hmong
    steps:
    - *id001
    - *id002
    - *id003
    - run: "python -m pip install imageio-ffmpeg==0.6.0 \npython episode71/ensure_ffmpeg.py"
    - uses: actions/download-artifact@v4
      with:
        pattern: fire71-checkpoint-${{ matrix.backend }}-*
        path: episode71/voice/audio/${{ matrix.locale }}
        merge-multiple: true
    - run: python -u episode71/finalize_native.py "${{ matrix.locale }}"
    - uses: actions/upload-artifact@v4
      with:
        name: fire71-voice-${{ matrix.locale }}
        path: 'episode71/voice/audio/${{ matrix.locale }}/*.mp3

          episode71/voice/audio/${{ matrix.locale }}/render_report.json'
        if-no-files-found: error
        retention-days: 14
        overwrite: true
  publish:
    needs:
    - english
    - online
    - native_final
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      actions: read
    steps:
    - *id001
    - *id002
    - *id003
    - run: "python -m pip install imageio-ffmpeg==0.6.0 \npython episode71/ensure_ffmpeg.py"
    - uses: actions/download-artifact@v4
      with:
        pattern: fire71-voice-*
        path: voice_artifacts
        merge-multiple: false
    - name: Verify all seventeen full waveforms and publish country files
      env:
        GH_TOKEN: ${{ github.token }}
      run: python -u episode71/publish_voices.py
    - uses: actions/upload-artifact@v4
      with:
        name: fire71-release-reports
        path: 'episode71/voice_delivery/*.json

          episode71/voice_delivery/SHA256SUMS.txt'
        if-no-files-found: error
        retention-days: 14
        overwrite: true
