name: Publish completed Kostenki19 final outputs only
on:
  push:
    branches: [codex/kostenki-final-transfer-20261111]
    paths: [transfer/**, .github/workflows/kostenki-final19.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify and publish the finished edit; no raw source clips
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/transfer/publish.py" -o publish.py
          python -u publish.py
