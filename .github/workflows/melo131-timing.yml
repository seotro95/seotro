name: Verify Melo Viet 1.3.1 TXT SRT fix
on:
  push:
    branches: [codex/melo130-txt-srt-20261103]
    paths: ['melo-viet-local/**', 'release-melo131/**', '.github/workflows/melo131-timing.yml']
permissions:
  contents: read
concurrency:
  group: melo131-timing-${{ github.ref }}
  cancel-in-progress: true
jobs:
  logic:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install pytest numpy soundfile
      - name: Audio tools
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Real PCM and application regression
        run: python -m pytest -q -ra melo-viet-local/tests
      - run: node --check melo-viet-local/app.js
      - run: bash -n melo-viet-local/setup.sh melo-viet-local/start.sh
      - name: Browser import, timing controls, multi-voice, and MP3
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" playwright@1.58.2
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser/node_modules/playwright" TEST_PYTHON=python node melo-viet-local/tests/browser.cjs
  windows-launcher:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Original PowerShell 5.1 launcher and WSL modes
        shell: powershell
        run: '& ./melo-viet-local/tests/test_launcher.ps1'
  package:
    needs: [logic, windows-launcher]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      MELO_VIET_ROOT: /tmp/melo131-root
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Download the exact original add-on and existing 1.2 model seed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/downloads"
          gh release download melo-viet-studio-1.3.0 --repo "$GITHUB_REPOSITORY" --pattern Melo-Viet-Studio-1.3.0-Them-Giong-Windows.zip --dir "$RUNNER_TEMP/downloads"
          gh release download melo-viet-studio-1.2.0 --repo "$GITHUB_REPOSITORY" --pattern Melo-Viet-Studio-1.2.0-CPU-Day-Du-Windows.zip --dir "$RUNNER_TEMP/downloads"
      - name: Prepare exact add-on; seed prior models only for installation testing
        run: |
          python release-melo131/package.py prepare --base "$RUNNER_TEMP/downloads/Melo-Viet-Studio-1.3.0-Them-Giong-Windows.zip" --work "$RUNNER_TEMP/melo131-package"
          python release-melo131/package.py seed-base --base "$RUNNER_TEMP/downloads/Melo-Viet-Studio-1.2.0-CPU-Day-Du-Windows.zip" --root "$MELO_VIET_ROOT"
          rm "$RUNNER_TEMP/downloads/Melo-Viet-Studio-1.2.0-CPU-Day-Du-Windows.zip"
      - name: Install actual package and verify update preserves prior data
        run: |
          PACKAGE="$RUNNER_TEMP/melo131-package/Melo-Viet-Cai-Rieng"
          bash "$PACKAGE/setup.sh" --fast-only
          printf 'previous recording\n' > "$MELO_VIET_ROOT/outputs/keep-update.txt"
          printf 'previous custom model\n' > "$MELO_VIET_ROOT/models/keep-update.txt"
          bash "$PACKAGE/setup.sh" --update
          cmp "$PACKAGE/timing.py" "$MELO_VIET_ROOT/app/timing.py"
          test "$(cat "$MELO_VIET_ROOT/outputs/keep-update.txt")" = 'previous recording'
          test "$(cat "$MELO_VIET_ROOT/models/keep-update.txt")" = 'previous custom model'
      - name: Real original models; TXT and SRT WAV/MP3 must have identical duration
        run: python release-melo131/check_timing_models.py --root "$MELO_VIET_ROOT" --output "$RUNNER_TEMP/MODEL-TIMING-QA.json"
      - name: Repack and verify all original model and launcher bytes
        run: python release-melo131/package.py repack --base "$RUNNER_TEMP/downloads/Melo-Viet-Studio-1.3.0-Them-Giong-Windows.zip" --work "$RUNNER_TEMP/melo131-package" --qa "$RUNNER_TEMP/MODEL-TIMING-QA.json"
      - name: Publish one corrected Windows add-on ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="melo-viet-studio-1.3.1-txt-srt-$GITHUB_RUN_ID"
          cat > "$RUNNER_TEMP/melo131-release.md" <<'NOTES'
          Sửa trực tiếp từ Melo-Viet-Studio-1.3.0-Them-Giong-Windows.zip.
          
          - SRT giữ mốc câu, khoảng nghỉ và mốc kết thúc; TXT nhập cùng thời lượng đích.
          - WAV và MP3 được đo lại sau khi tạo. Đoạn quá dài báo lỗi, không cắt lời.
          - Giữ nguyên toàn bộ voice-pack và launcher của gói gốc; không thêm model khác.
          
          Đây là gói cập nhật Thêm Giọng cho bộ Melo + Việt đã cài. Đóng tool, giải nén, chạy CAP_NHAT.bat rồi MO_TOOL.bat; nhấn Ctrl+F5 để thấy phiên bản 1.3.1. Giữ model và bản thu cũ.
          
          Kiểm thử: Python/PCM, trình duyệt, launcher PowerShell với WSL giả lập, cài đặt/cập nhật Linux Python 3.10 và model Piper/Supertonic thật. Không chứng nhận chất lượng phát âm bằng người nghe.
          NOTES
          gh release create "$TAG" "$RUNNER_TEMP/melo131-package/Melo-Viet-Studio-1.3.1-Them-Giong-Windows.zip" "$RUNNER_TEMP/melo131-package/Melo-Viet-Studio-1.3.1-Them-Giong-Windows.zip.sha256" "$RUNNER_TEMP/melo131-package/TXT-SRT-QA.json" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Melo + Việt Studio 1.3.1 Thêm Giọng · sửa TXT/SRT" --notes-file "$RUNNER_TEMP/melo131-release.md" --latest=false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: melo131-real-model-qa
          path: ${{ runner.temp }}/MODEL-TIMING-QA.json
          if-no-files-found: ignore
