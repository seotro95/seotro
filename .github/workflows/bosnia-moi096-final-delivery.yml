name: Bosnia MOI096 publish verify and archive sixteen voices
on:
  push:
    branches: [codex/bosnia-moi096-production-20261121]
    paths: [.github/workflows/bosnia-moi096-final-delivery.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: bosnia-moi096
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python bosnia-moi096/extract_content.py
          python bosnia-moi096/extract_voice_inputs.py
          python bosnia-moi096/build_documents.py
          python bosnia-moi096/voice_gate.py
          python -m pip install imageio-ffmpeg==0.6.0
          python bosnia-moi096/ensure_ffmpeg.py
          python -u bosnia-moi096/wait_for_sources.py
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: bosnia-moi096-voice-*
          path: voice_artifacts
          merge-multiple: false
          run-id: 44926779642
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: bosnia-moi096-voice-en-US
          path: voice_artifacts/bosnia-moi096-voice-en-US
          run-id: 44925084497
          github-token: ${{ github.token }}
      - name: Decode and publish all sixteen complete voices
        run: python -u bosnia-moi096/publish_voices.py
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: bosnia-moi096-final-release-reports
          path: |
            bosnia-moi096/voice_delivery/*.json
            bosnia-moi096/voice_delivery/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
  verify_and_archive:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/bosnia-moi096-production-20261121
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python bosnia-moi096/extract_content.py
          python bosnia-moi096/extract_voice_inputs.py
          python bosnia-moi096/build_documents.py
          python bosnia-moi096/voice_gate.py
          python -m pip install imageio-ffmpeg==0.6.0
          python -u bosnia-moi096/verify_and_archive.py
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bosnia-moi096-public-verification
          path: |
            bosnia-moi096/PUBLIC_DELIVERY_QA.json
            bosnia-moi096/GITHUB_ASSET_AUDIT.json
          if-no-files-found: ignore
          retention-days: 30
