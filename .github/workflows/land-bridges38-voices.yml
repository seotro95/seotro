name: Land bridges38 locked17voices22m32s
on:
  push:
    branches: [codex/land-bridges38-production-20261111]
    paths: [.github/workflows/land-bridges38-voices.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: episode38
      - run: python3 episode38/extract_inputs.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install edge-tts==7.3.1
      - run: python episode38/bootstrap_tool.py online
      - run: python -u episode38/preflight38.py
      - uses: actions/upload-artifact@v4
        with:
          name: land38-preflight
          path: |
            episode38/VOICE_PREFLIGHT_QA.json
            episode38/voice/preview/LAND_BRIDGES_38_EN_PREVIEW_30s.mp3
          if-no-files-found: error
          retention-days: 14
  online:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        locale: [en-US,vi-VN,es-ES,fr-FR,ja-JP,ko-KR,de-DE,it-IT,pt-PT,nl-NL,pl-PL,sv-SE,da-DK,fi-FI,nb-NO,cs-CZ]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: episode38
      - run: python3 episode38/extract_inputs.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install edge-tts==7.3.1
      - run: python episode38/bootstrap_tool.py online
      - name: Restore same-run checkpoints when a failed locale is rerun
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          name: land38-checkpoint-${{ matrix.locale }}
          path: episode38/voice/audio/${{ matrix.locale }}
      - name: Generate full localized narration with unchanged voiceID
        run: python -u episode38/render_episode.py ${{ matrix.locale }}
      - name: Keep completed raw speech if a repair is needed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: land38-checkpoint-${{ matrix.locale }}
          overwrite: true
          path: |
            episode38/voice/audio/${{ matrix.locale }}/raw-*.wav
            episode38/voice/audio/${{ matrix.locale }}/raw-*.json
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: land38-voice-${{ matrix.locale }}
          path: |
            episode38/voice/audio/${{ matrix.locale }}/LAND_BRIDGES_38_*.mp3
            episode38/voice/audio/${{ matrix.locale }}/render_report.json
          if-no-files-found: error
          retention-days: 14
  hmong:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0,1]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: episode38
      - run: python3 episode38/extract_inputs.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.8.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==2.2.6 soundfile==0.13.1 scipy==1.15.3 librosa==0.11.0 soxr==1.0.0
      - run: python -u episode38/bootstrap_tool.py native
      - name: Restore same-run native speech checkpoints
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          name: land38-native-checkpoint-${{ matrix.shard }}
          path: episode38/voice/audio/mww
      - name: Native female3 speech with pinned Hmong1.6.6 models
        run: python -u episode38/render_native38.py ${{ matrix.shard }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: land38-native-checkpoint-${{ matrix.shard }}
          overwrite: true
          path: |
            episode38/voice/audio/mww/raw-*.wav
            episode38/voice/audio/mww/raw-*.native.json
          if-no-files-found: error
          retention-days: 14
  native_final:
    needs: hmong
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: episode38
      - run: python3 episode38/extract_inputs.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: land38-native-checkpoint-*
          path: episode38/voice/audio/mww
          merge-multiple: true
      - run: python -u episode38/finalize_native38.py
      - uses: actions/upload-artifact@v4
        with:
          name: land38-voice-mww
          path: |
            episode38/voice/audio/mww/LAND_BRIDGES_38_Hmong_Trang_Nu.mp3
            episode38/voice/audio/mww/render_report.json
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: [online,native_final]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: episode38
      - run: python3 episode38/extract_inputs.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: land38-voice-*
          path: voice_artifacts
      - uses: actions/download-artifact@v4
        with:
          name: land38-preflight
          path: preflight_artifact
      - name: Verify decoded durations, package and publish17 separate country files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u episode38/publish_voices38.py
