name: Build Windows Portable
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-portable.yml'
      - 'voice-studio/**'
env:
  PYTHONUTF8: "1"
  HF_HUB_DISABLE_XET: "1"
permissions:
  contents: write
concurrency:
  group: windows-portable
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Install CPU voice dependencies
        run: python -m pip install -r voice-studio/requirements-dev.txt
      - name: Prepare verified FFmpeg for regression checks
        shell: pwsh
        run: |
          python -c "import sys;sys.path.insert(0,'voice-studio/packaging');from build_windows import download_verified_ffmpeg;from pathlib import Path;download_verified_ffmpeg(Path(r'${{ runner.temp }}/tools/ffmpeg'),Path(r'${{ runner.temp }}/portable/downloads'))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -Path $env:GITHUB_PATH -Value "${{ runner.temp }}/tools/ffmpeg/bin"
      - name: Run regression checks
        working-directory: voice-studio
        run: python -m pytest -q
      - name: Build and test relocated offline Windows bundle
        run: python voice-studio/packaging/build_windows.py --output "${{ runner.temp }}/portable/Voice-Studio"
      - name: Upload checked build
        uses: actions/upload-artifact@v4
        with:
          name: Voice-Studio-Windows-x64
          path: |
            ${{ runner.temp }}/portable/Voice-Studio-Windows-x64.zip
            ${{ runner.temp }}/portable/Voice-Studio-Windows-x64.zip.sha256
          compression-level: 0
          retention-days: 14
      - name: Publish downloadable Windows package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-portable-${{ github.run_number }}"
          $body = @"
          Extract all files, then double-click MO_VOICE_STUDIO.bat.
          Includes Windows Python 3.12, FFmpeg, Nano and Turbo Vietnamese voices.
          No Python installation, venv setup, API key or first-run model download is required for bundled voices.
          Qwen international voices and Ollama writing are optional downloads.
          Native Windows smoke tests, relocated-interpreter inference and MP4 export passed before publication.
          Source commit: ${{ github.sha }}
          "@
          $body | Set-Content -Encoding utf8 "${{ runner.temp }}/release-notes.txt"
          gh release create $tag "${{ runner.temp }}/portable/Voice-Studio-Windows-x64.zip" "${{ runner.temp }}/portable/Voice-Studio-Windows-x64.zip.sha256" --target "${{ github.sha }}" --title "Voice Studio Windows - ready to use" --notes-file "${{ runner.temp }}/release-notes.txt" --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
