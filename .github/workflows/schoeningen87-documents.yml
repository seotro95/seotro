name: Schoeningen87 publish script and110silent prompts
on:
  push:
    branches: [codex/schoeningen87-production-20261113]
    paths: [.github/workflows/schoeningen87-documents.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: episode87
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate123cues,110prompts and public document release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u episode87/publish_documents.py
