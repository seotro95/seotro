name: Cancel stalled voice verification run
on:
  push:
    branches: [codex/voice-studio-standalone-download]
    paths: [.github/workflows/cancel-stuck-voice-run.yml]
permissions:
  actions: write
  contents: read
jobs:
  cancel-own-stalled-run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Force-cancel only the replaced verification run
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $voiceRun = gh api repos/seotro95/seotro/actions/runs/39112718590 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($voiceRun.head_sha -ne '1c4a7284dbcb5e4d4bf4fbe6134ee326d41baa3c' -or $voiceRun.head_branch -ne 'codex/voice-studio-standalone-download' -or $voiceRun.path -ne '.github/workflows/standalone-voice-portable.yml') {
            throw 'Run identity does not match our replaced voice verification; no cancellation performed.'
          }
          if ($voiceRun.status -eq 'completed') {
            Write-Output 'Replaced verification has already completed; no cancellation needed.'
          } else {
            gh api --method POST repos/seotro95/seotro/actions/runs/39112718590/force-cancel --silent
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Output 'Force-cancel requested for our replaced verification run only.'
          }
