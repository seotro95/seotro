name: Qanat MOI030 verify public delivery and save completed project
on:
  push:
    branches: [codex/qanat-moi030-production-20261117]
    paths: [.github/workflows/qanat-moi030-verify-archive.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  verify_and_archive:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/qanat-moi030-production-20261117
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python qanat-moi030/extract_content.py
          python qanat-moi030/extract_voice_inputs.py
          python qanat-moi030/build_documents.py
          python qanat-moi030/voice_gate.py
          python -m pip install imageio-ffmpeg==0.6.0
          python -u qanat-moi030/verify_and_archive.py
        env:
          GH_TOKEN: ${{ github.token }}
          COUNTRY_DELIVERY_RUN: '44161974765'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qanat-moi030-public-verification
          path: |
            qanat-moi030/PUBLIC_DELIVERY_QA.json
            qanat-moi030/GITHUB_ASSET_AUDIT.json
          if-no-files-found: ignore
          retention-days: 30

