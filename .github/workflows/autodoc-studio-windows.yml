name: Build and test AutoDocStudio Windows portable
on:
  push:
    branches: [codex/autodoc-studio-v1-20261111]
    paths: [tools/autodoc-studio/**, .github/workflows/autodoc-studio-windows.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/autodoc-studio
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build frozen app and test actual automatic edit
        shell: pwsh
        working-directory: tools/autodoc-studio
        run: ./build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AutoDocStudio-Windows-release
          path: tools/autodoc-studio/release/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish verified Windows tool
        shell: pwsh
        working-directory: tools/autodoc-studio
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $tag='autodoc-studio-v1.0.0'
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'AutoDoc Studio1.0 — Tự dựng từ voice và video' --draft --notes 'Windows x64 portable. Whisper nhận lời,CLIP so khớp hình,tự dựng10cảnh mở đầu và giữ thời lượng voice. Không cần APItrả phí. Lần đầu tự tải FFmpeg và model. Đã chạy thử fileexe trên Windows với media thật,kiểm tiếng nguồn,đồng bộ và cache. Xem hướng dẫn và giới hạn trong ZIP.'
            if ($LASTEXITCODE -ne 0) { throw 'Cannot create release' }
          }
          Get-ChildItem release -File | ForEach-Object {
            gh release upload $tag $_.FullName --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Upload failed' }
          }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed' }
      - name: Retain diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AutoDocStudio-Windows-diagnostics
          path: |
            tools/autodoc-studio/build/AutoDocStudio/warn-AutoDocStudio.txt
            tools/autodoc-studio/WINDOWS_TEST_REPORT.json
            tools/autodoc-studio/windows test/**/STATUS.json
            tools/autodoc-studio/windows test/**/KIEM_TRA_VIDEO.json
            C:/Users/runneradmin/AppData/Local/AutoDocStudio/application.log
          if-no-files-found: ignore
          retention-days: 7
