name: Deliver Kailasa 001 production kit
on:
  push:
    branches: [codex/kailasa-007-22m32s]
    paths: ['episodes/kailasa-007/**', '.github/workflows/kailasa-007-delivery.yml']
permissions:
  contents: write
concurrency:
  group: kailasa-007-delivery
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out reviewed text and manifest
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: episodes/kailasa-007
      - name: Check out temporary synthetic-audio transfer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: a9ae76f16493b36b74d26ca49fd385b002530d2d
          path: _kailasa_parts
          persist-credentials: false
      - name: Verify files and save draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python episodes/kailasa-007/publish_release.py
          --parts _kailasa_parts
          --manifest episodes/kailasa-007/GITHUB_TRANSFER_MANIFEST.json
          --out _kailasa_release
