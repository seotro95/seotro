name: Land bridges38 finish English from preserved speech groups
on:
  push:
    branches: [codex/land-bridges38-production-20261111]
    paths: [.github/workflows/land-bridges38-english-shards.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  english:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: episode38
      - run: python3 episode38/extract_inputs.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install imageio-ffmpeg==0.6.0 edge-tts==7.3.1
          python episode38/ensure_ffmpeg.py
          python episode38/bootstrap_tool.py online
      - name: Restore fifty or more already completed English cues
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 43055537796
          name: land38-repair-checkpoint-en-US
          path: episode38/voice/audio/en-US
      - name: Restore any additional speech from this same group attempt
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          name: land38-en-shard-${{ matrix.shard }}
          path: episode38/voice/audio/en-US
      - name: Continue only this cue group with original Andrew voice and phrasing
        run: python -u episode38/english_shards.py shard ${{ matrix.shard }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: land38-en-shard-${{ matrix.shard }}
          overwrite: true
          path: |
            episode38/voice/audio/en-US/raw-*.wav
            episode38/voice/audio/en-US/raw-*.json
            episode38/voice/audio/en-US/pending_speech.json
            episode38/voice/audio/en-US/SHARD_*_QA.json
          if-no-files-found: error
          retention-days: 14
  english_final:
    needs: english
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: episode38
      - run: python3 episode38/extract_inputs.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install imageio-ffmpeg==0.6.0
          python episode38/ensure_ffmpeg.py
      - uses: actions/download-artifact@v4
        with:
          pattern: land38-en-shard-*
          path: episode38/voice/audio/en-US
          merge-multiple: true
      - name: Validate all original request signatures and fit136 English cues exactly
        run: python -u episode38/english_shards.py finalize
      - uses: actions/upload-artifact@v4
        with:
          name: land38-voice-en-US
          path: |
            episode38/voice/audio/en-US/LAND_BRIDGES_38_My_Tieng_Anh.mp3
            episode38/voice/audio/en-US/render_report.json
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: english_final
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: episode38
      - run: python3 episode38/extract_inputs.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install imageio-ffmpeg==0.6.0
          python episode38/ensure_ffmpeg.py
      - name: Retrieve the sixteen completed original country voices
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 43050614061
          pattern: land38-voice-*
          path: voice_artifacts
      - uses: actions/download-artifact@v4
        with:
          name: land38-voice-en-US
          path: voice_artifacts/land38-voice-en-US
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 43050614061
          name: land38-preflight
          path: preflight_artifact
      - name: Decode-check17 complete voices and publish separate country downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u episode38/publish_voices38.py
