name: Voice Studio 1.12 - Full native VoxCPM2 Windows package

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the full package after actual Windows CPU PCM checks
        type: boolean
        default: true
  push:
    branches: [voice-studio-native-voxcpm-v1.12.0]
    paths:
      - '.github/workflows/voice-studio-native-voxcpm-1.12.yml'
      - 'voice-studio-rieng-portable/**'

permissions:
  contents: write
  actions: read

concurrency:
  group: voice-studio-voxcpm-1.12-windows-${{ github.sha }}
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  HF_HUB_DISABLE_XET: '1'
  NATIVE_REVISION: '2597b300f5961999387c84c65f2e8e79c088a571'

jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        device: [cpu, cuda]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: x64
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Stage checksum-pinned CUDA12 toolkit with Pascal support
        if: matrix.device == 'cuda'
        shell: pwsh
        run: |
          $cuda = "${{ runner.temp }}/cuda-12.6.3"
          python voice-studio-rieng-portable/packaging/prepare_cuda.py --output $cuda --downloads "${{ runner.temp }}/cuda-downloads"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CUDA_PATH=$cuda" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CUDAToolkit_ROOT=$cuda" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$cuda/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Fetch the immutable native source
        shell: pwsh
        run: |
          git init "${{ runner.temp }}/audio.cpp"
          git -C "${{ runner.temp }}/audio.cpp" remote add origin https://github.com/0xShug0/audio.cpp.git
          git -C "${{ runner.temp }}/audio.cpp" fetch --depth=1 origin "$env:NATIVE_REVISION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C "${{ runner.temp }}/audio.cpp" checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows C ABI and GGUF converter for OmniVoice and VoxCPM2
        shell: pwsh
        run: |
          python voice-studio-rieng-portable/packaging/build_native.py --source "${{ runner.temp }}/audio.cpp" --build "${{ runner.temp }}/native-build" --output "${{ runner.temp }}/runtime-native/${{ matrix.device }}" --device '${{ matrix.device }}' --jobs 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: voice-voxcpm-native-${{ matrix.device }}
          path: ${{ runner.temp }}/runtime-native/${{ matrix.device }}
          retention-days: 14
          if-no-files-found: error
      - name: Install CPU-only conversion dependencies
        if: matrix.device == 'cpu'
        shell: pwsh
        run: |
          python -m pip --isolated install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch==2.8.0+cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip --isolated install --disable-pip-version-check --no-cache-dir numpy==1.26.4 safetensors==0.8.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retrieve and verify the public immutable original checkpoint
        if: matrix.device == 'cpu'
        shell: python
        run: |
          import os, pathlib, sys
          sys.path.insert(0, str(pathlib.Path('voice-studio-rieng-portable/app').resolve()))
          from public_modelpack import ensure_model_source, cleanup_download_parts
          data = pathlib.Path(os.environ['RUNNER_TEMP']) / 'source-model-data'
          source = ensure_model_source(data)
          cleanup_download_parts(data)
          print('Verified public source:', source)
      - name: Convert unchanged public VoxCPM2 weights to standalone Q8 GGUF
        if: matrix.device == 'cpu'
        shell: pwsh
        run: |
          python voice-studio-rieng-portable/packaging/prepare_voxcpm_gguf.py --source-model "${{ runner.temp }}/source-model-data/models/voxcpm2-original" --converter "${{ runner.temp }}/runtime-native/cpu/audiocpp_gguf.exe" --data-dir "${{ runner.temp }}/native-model-data" --work-dir "${{ runner.temp }}/model-conversion"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item -Recurse -Force "${{ runner.temp }}/source-model-data"
      - uses: actions/upload-artifact@v4
        if: matrix.device == 'cpu'
        with:
          name: voice-voxcpm-native-model
          path: ${{ runner.temp }}/native-model-data/models
          retention-days: 14
          if-no-files-found: error

  package:
    needs: native
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: x64
      - uses: actions/download-artifact@v4
        with:
          pattern: voice-voxcpm-native-*
          path: ${{ runner.temp }}/native-artifacts
      - name: Arrange the pinned CPU, CUDA and model assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "${{ runner.temp }}/runtime-native" | Out-Null
          New-Item -ItemType Directory -Force "${{ runner.temp }}/native-model-data" | Out-Null
          Move-Item "${{ runner.temp }}/native-artifacts/voice-voxcpm-native-cpu" "${{ runner.temp }}/runtime-native/cpu"
          Move-Item "${{ runner.temp }}/native-artifacts/voice-voxcpm-native-cuda" "${{ runner.temp }}/runtime-native/cuda"
          Move-Item "${{ runner.temp }}/native-artifacts/voice-voxcpm-native-model" "${{ runner.temp }}/native-model-data/models"
      - name: Download checksum-pinned Windows base and extract only its QA runtime
        shell: python
        run: |
          import hashlib, os, pathlib, shutil, sys, urllib.request, zipfile
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          target = temp / 'Voice-Studio-1.10-base.zip'
          url = 'https://github.com/seotro95/seotro/releases/download/voice-studio-reference-1.10-40852923612/Voice-Studio-Rieng-1.10.0-19-Giong-GitHub-Windows-x64.zip'
          with urllib.request.urlopen(url, timeout=120) as source, target.open('xb') as output:
              shutil.copyfileobj(source, output, 8 * 1024**2)
          with target.open('rb') as source:
              actual = hashlib.file_digest(source, 'sha256').hexdigest()
          if actual != '65446c1a1799699b3aadad616461e97cf66c049597c7ae9a5cbf3887f20312f6':
              raise ValueError('Published Windows base SHA256 mismatch')
          sys.path.insert(0, str(pathlib.Path('voice-studio-rieng-portable/packaging').resolve()))
          from build_windows import safe_zip_path
          with zipfile.ZipFile(target) as archive:
              for entry in archive.infolist():
                  relative = safe_zip_path(entry)[1:]
                  if not relative or relative[0] not in {'runtime', 'ffmpeg'}:
                      continue
                  if any(part in {'.git', '.aws', '.agents', '.codex'} for part in relative):
                      continue
                  destination = (temp / 'qa-runtime').joinpath(*relative)
                  if entry.is_dir():
                      destination.mkdir(parents=True, exist_ok=True)
                  else:
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      with archive.open(entry) as source, destination.open('xb') as output:
                          shutil.copyfileobj(source, output, 1024**2)
      - name: Retrieve the pinned public reference WAV
        shell: python
        run: |
          import hashlib, os, pathlib, urllib.request
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'public-reference.wav'
          url = 'https://raw.githubusercontent.com/0xShug0/audio.cpp/2597b300f5961999387c84c65f2e8e79c088a571/assets/resources/b.wav'
          with urllib.request.urlopen(url, timeout=60) as response:
              value = response.read()
          if hashlib.sha256(value).hexdigest() != '32bf74dfb8342ccc8284f47a9e5fe1f41b458a983a00938ed170f76951ce638f':
              raise ValueError('Public reference SHA256 mismatch')
          target.write_bytes(value)
      - name: Create actual French and Japanese PCM with the Windows CPU library
        shell: pwsh
        run: |
          $env:PYTHONHOME = ''
          $env:PYTHONPATH = ''
          $env:PYTHONNOUSERSITE = '1'
          $env:PATH = "${{ runner.temp }}/qa-runtime/ffmpeg/bin;${{ runner.temp }}/qa-runtime/runtime;$env:PATH"
          & "${{ runner.temp }}/qa-runtime/runtime/python.exe" -s -X utf8 voice-studio-rieng-portable/packaging/smoke_native_voxcpm.py --app-dir voice-studio-rieng-portable/app --native-root "${{ runner.temp }}/runtime-native" --data-dir "${{ runner.temp }}/native-model-data" --reference "${{ runner.temp }}/public-reference.wav" --output "${{ runner.temp }}/Windows-Native-VoxCPM-QA.json" --steps 8 --threads 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Assemble the complete portable with current source and all native assets
        shell: pwsh
        run: |
          python voice-studio-rieng-portable/packaging/build_full_update.py --base-archive "${{ runner.temp }}/Voice-Studio-1.10-base.zip" --output "${{ runner.temp }}/full-archive/Voice-Studio-1.12.0-Full-Windows-x64.zip" --native-root "${{ runner.temp }}/runtime-native" --native-model "${{ runner.temp }}/native-model-data" --windows-qa "${{ runner.temp }}/Windows-Native-VoxCPM-QA.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Release assembly inputs after the complete ZIP is closed and checksummed
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force "${{ runner.temp }}/native-artifacts", "${{ runner.temp }}/runtime-native", "${{ runner.temp }}/native-model-data", "${{ runner.temp }}/qa-runtime"
          Remove-Item -Force "${{ runner.temp }}/Voice-Studio-1.10-base.zip"
      - name: Split the complete ZIP into GitHub-sized release pieces with verified joiner
        shell: python
        run: |
          import os, pathlib, sys, shutil
          sys.path.insert(0, str(pathlib.Path('voice-studio-rieng-portable/packaging').resolve()))
          from build_full_update import split_release
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          output = split_release(temp / 'full-archive/Voice-Studio-1.12.0-Full-Windows-x64.zip', temp / 'downloads')
          shutil.copy2(temp / 'Windows-Native-VoxCPM-QA.json', output / 'Windows-Native-VoxCPM-QA.json')
      - name: Preserve diagnostics when a native Windows check fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Voice-Studio-1.12-Windows-Failure-Diagnostics
          path: |
            ${{ runner.temp }}/native-model-data/international-native-backend.log
            ${{ runner.temp }}/Windows-Native-VoxCPM-QA.json
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: Voice-Studio-1.12-Full-Windows-Native-VoxCPM
          path: ${{ runner.temp }}/downloads/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish the full experimental portable only after Windows CPU speech checks
        if: github.event_name == 'push' || inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "voice-studio-native-voxcpm-1.12-${{ github.run_id }}-${{ github.run_attempt }}"
          $assets = @(Get-ChildItem -File "${{ runner.temp }}/downloads" | ForEach-Object { $_.FullName })
          if ($assets.Count -lt 6) { throw 'Full archive parts, hashes, joiner and QA report are required' }
          $notes = @'
          Complete Windows portable: bundled Python, FFmpeg, public Nano/Turbo models, encrypted 19-voice installer, native VoxCPM2 Q8 model and CPU/CUDA libraries.

          Download every .partNNN file and GHEP_GOI.cmd into the same new folder. Run GHEP_GOI.cmd to reassemble and verify the full ZIP, then extract the entire ZIP. Keep the original private-voice password; decrypted recordings are not published.

          Actual short French/Japanese PCM passed on the Windows CPU build. CUDA12 includes sm61 code for Pascal compatibility; GPU inference, GTX1060 performance, pronunciation/voice identity, a full-hour render and 30x real-time throughput are not established. All model, runtime and full-archive checksums are retained. The native Q8 path keeps the VoxCPM2 model family instead of silently changing languages or substituting Turbo.
          '@
          $notesFile = "${{ runner.temp }}/release-notes.txt"
          $notes | Set-Content -Encoding utf8 $notesFile
          gh release create $tag @assets --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Voice Studio 1.12 - Full native VoxCPM2 Windows experiment" --prerelease --latest=false --notes-file $notesFile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
