name: Verify Windows Online19 package and publish reviewed assets
on:
  push:
    branches: [codex/release-online19]
    paths:
      - '.github/workflows/release-online19.yml'
      - 'release-online19/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-online19
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild exact SHA256-reviewed standalone and update ZIPs
        run: python release-online19/reconstruct.py
      - uses: actions/upload-artifact@v4
        with:
          name: online19-reviewed-assets
          path: ${{ runner.temp }}/online19-release-assets/*
          compression-level: 0
          retention-days: 3
  windows:
    needs: assemble
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: online19-reviewed-assets
          path: ${{ runner.temp }}/reviewed-assets
      - name: Test bundled Python, local API, DPAPI and synthetic cloud PCM pipeline
        shell: pwsh
        run: python release-online19/windows_smoke.py "$env:RUNNER_TEMP/reviewed-assets/Voice-Studio-1.13.0-Online19-Windows.zip" "$env:RUNNER_TEMP/online19-qa"
      - uses: actions/upload-artifact@v4
        with:
          name: online19-windows-qa
          path: ${{ runner.temp }}/online19-qa/WINDOWS-QA.json
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: online19-windows-failure-log
          path: ${{ runner.temp }}/online19-qa/*.log
          retention-days: 3
  publish:
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: online19-reviewed-assets
          path: ${{ runner.temp }}/release-assets
      - uses: actions/download-artifact@v4
        with:
          name: online19-windows-qa
          path: ${{ runner.temp }}/release-assets
      - name: Verify every asset against the reviewed release manifest
        env:
          RELEASE_ASSETS: ${{ runner.temp }}/release-assets
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['RELEASE_ASSETS'])
          expected=json.loads(Path('release-online19/expected-release-assets.json').read_text())
          assert {p.name for p in root.iterdir() if p.is_file()}==set(expected)
          for name,record in expected.items():
              p=root/name
              with p.open('rb') as f:digest=hashlib.file_digest(f,'sha256').hexdigest()
              assert p.stat().st_size==record['size'] and digest==record['sha256'],name
          print('Every release asset matches the reviewed SHA256.')
          PY
      - name: Upload Windows-verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload voice-studio-1.13.0-online19 "$RUNNER_TEMP"/release-assets/* --repo seotro95/seotro --clobber
      - name: Verify server-side sizes and SHA256 digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: python release-online19/verify_remote.py
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit voice-studio-1.13.0-online19 --repo seotro95/seotro --draft=false --latest=false --target "$GITHUB_SHA"
