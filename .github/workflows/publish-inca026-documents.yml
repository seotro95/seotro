name: Publish requested inca026 documents
on:
  push:
    branches: [codex/inca026-20m42s]
    paths: ['deliveries/inca026_documents/READY.json']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /deliveries/inca026_documents/
      - name: Verify and upload requested text deliverables
        env:
          GH_TOKEN: ${{ github.token }}
        run: python deliveries/inca026_documents/publish_documents.py
