name: Schoeningen87 English and NamMinh timing preflight
permissions:
  contents: read
jobs:
  english:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        sparse-checkout: episode87
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python episode87/build_documents.py
    - run: 'python -m pip install imageio-ffmpeg==0.6.0 edge-tts==7.3.1

        python episode87/ensure_ffmpeg.py

        python episode87/bootstrap_tool.py online

        '
    - name: Validate exact text boundaries and30second English preview
      run: python -u episode87/render_english_groups.py --preview
    - if: always()
      uses: actions/upload-artifact@v4
      with:
        name: schoen87-english-preflight
        path: 'episode87/voice/en_preview/SCHOENINGEN_87_EN_PREVIEW_30s.mp3

          episode87/voice/en_preview/render_report.json

          episode87/voice/en_preview/group-*.wav

          episode87/voice/en_preview/group-*.json

          episode87/voice/en_preview/raw-*.json

          '
        if-no-files-found: ignore
        retention-days: 14
  namminh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        sparse-checkout: episode87
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: 'python -m pip install imageio-ffmpeg==0.6.0 edge-tts==7.3.1

        python episode87/ensure_ffmpeg.py

        python episode87/bootstrap_tool.py online'
    - run: python -u episode87/preflight_namminh.py
    - if: always()
      uses: actions/upload-artifact@v4
      with:
        name: schoen87-namminh-preflight
        path: 'episode87/NAM_MINH_PREFLIGHT_QA.json

          episode87/voice/vi_preview/*.mp3'
        if-no-files-found: ignore
        retention-days: 14
'on':
  push:
    branches:
    - codex/schoeningen87-production-20261113
    paths:
    - .github/workflows/schoeningen87-preflight.yml
  workflow_dispatch: null

# Document delivery flag validated after public ZIP verification.
