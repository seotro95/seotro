name: Verify native Hmong Daw RPA synthesis
on:
  push:
    branches: [codex/hmong-rpa-check]
permissions:
  contents: write
jobs:
  hmong:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install torch==2.2.2+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: pip install transformers==4.46.3 'numpy<2' soundfile onnx==1.17.0 onnxruntime==1.23.2
      - run: python studio-hmong-qa/hmong.py
      - name: Retain real Hmong samples and provenance (no model redistribution)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload melo-viet-studio-1.3.0 "$RUNNER_TEMP/hmong-qa/"* --clobber --repo seotro95/seotro
