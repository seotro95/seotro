name: Verify native Hmong Daw RPA synthesis
on:
  push:
    branches: [codex/hmong-rpa-check]
permissions:
  contents: write
jobs:
  hmong:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python studio-hmong-qa/hmong.py
