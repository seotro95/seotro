name: Ollantaytambo 004 - complete documents and 16 male voices

on:
  push:
    branches:
      - codex/ollantaytambo-004-production-20261117
    paths:
      - .github/workflows/ollantaytambo-004-production.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ollantaytambo-004-voices
  cancel-in-progress: false

jobs:
  documents:
    name: Complete script and prompt package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: production/ollantaytambo004
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile and validate all source documents
        run: |
          python -m py_compile production/ollantaytambo004/*.py production/ollantaytambo004/vendor/*.py
          python production/ollantaytambo004/build_documents.py --out outputs/documents
      - uses: actions/upload-artifact@v4
        with:
          name: 004_Ollantaytambo_Documents
          path: outputs/documents/
          if-no-files-found: error
          retention-days: 14

  voices:
    name: Voice ${{ matrix.language }}
    needs: documents
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        language: ["en", "vi", "es", "fr", "ja", "ko", "de", "it", "pt", "nl", "pl", "sv", "da", "fi", "no", "cs"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: production/ollantaytambo004
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audio tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes ffmpeg
          python -m pip install -r production/ollantaytambo004/requirements.txt
      - name: Restore this voice's verified native parts
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: work/voice_render/${{ matrix.language }}/**/raw_*
          key: ollantaytambo004-native-v2-${{ matrix.language }}-${{ hashFiles('production/ollantaytambo004/script_master.json', 'production/ollantaytambo004/translations/*.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ollantaytambo004-native-v2-${{ matrix.language }}-${{ hashFiles('production/ollantaytambo004/script_master.json', 'production/ollantaytambo004/translations/*.json') }}-
      - name: Render one male voice sequentially and verify 21m42s
        run: |
          python production/ollantaytambo004/render_voices.py --script production/ollantaytambo004/script_master.json --translations production/ollantaytambo004/translations --out outputs/voices --work work/voice_render --languages ${{ matrix.language }} --workers 1
      - name: Retain verified native parts
        if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: work/voice_render/${{ matrix.language }}/**/raw_*
          key: ollantaytambo004-native-v2-${{ matrix.language }}-${{ hashFiles('production/ollantaytambo004/script_master.json', 'production/ollantaytambo004/translations/*.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload separate country voice
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 004_voice_${{ matrix.language }}
          path: outputs/voices/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Retain recoverable country checkpoints
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: 004_checkpoint_${{ matrix.language }}
          path: |
            outputs/voices/
            work/voice_render/${{ matrix.language }}/**/raw_*
            work/voice_render/${{ matrix.language }}/**/REPORT.json
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Assemble full package
    if: always()
    needs: [documents, voices]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: production/ollantaytambo004
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audio verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes ffmpeg
      - name: Retrieve completed separate country artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 004_voice_*
          path: work/voice_artifacts
      - name: Verify and assemble all 16 audio tracks
        run: python production/ollantaytambo004/collect_voices.py --artifacts work/voice_artifacts --out outputs/voices
      - name: Build complete documents with measured audio manifests
        run: python production/ollantaytambo004/build_documents.py --out outputs/documents
      - name: Upload full production package
        uses: actions/upload-artifact@v4
        with:
          name: 004_Ollantaytambo_FULL_16Voices_21m42s
          path: |
            outputs/documents/
            outputs/voices/*.m4a
            outputs/voices/*.wav
            outputs/voices/*.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
