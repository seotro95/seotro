name: Check documentary translation quality
on:
  push:
    branches: [codex/siberia-2536-production]
    paths:
      - 'siberia-production/translate_llm.py'
      - '.github/workflows/siberia-translation-probe.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Translate challenging geological terms and check factual preservation
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUTF8: '1'
        run: python siberia-production/translate_llm.py --probe
