name: Build usable Hmoob VoiceLab for Windows

on:
  workflow_dispatch:
  push:
    branches: ['codex/voicelab-ready-*']
    paths: ['hmoob-voicelab/**', '.github/workflows/voicelab-portable.yml']
  pull_request:
    paths: ['hmoob-voicelab/**', '.github/workflows/voicelab-portable.yml']

permissions:
  contents: read

concurrency:
  group: voicelab-portable-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  PYTHONUNBUFFERED: '1'
  HF_HUB_DISABLE_XET: '1'

jobs:
  startup-hotfix:
    name: Verify small startup update on the shipped Windows package
    runs-on: windows-2022
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Run focused startup regressions
        working-directory: hmoob-voicelab
        run: |
          python -m unittest discover -s tests -p test_bootstrap.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s packaging -p test_*.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download the exact previously shipped Windows package
        uses: actions/download-artifact@v4
        with:
          name: Hmoob-VoiceLab-Windows-x64
          run-id: 39574258782
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/shipped-voicelab
      - name: Check the shipped archive and extract it with Windows
        shell: pwsh
        run: |
          $archive = Join-Path '${{ runner.temp }}/shipped-voicelab' 'Hmoob-VoiceLab-Windows-x64.zip'
          $expected = '0f8117f64879bba0df286901881ab51e523dfbd5f905f43413879ce2e80f1c25'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Previously shipped ZIP does not match the verified build.' }
          Expand-Archive -LiteralPath $archive -DestinationPath '${{ runner.temp }}/startup-verify' -ErrorAction Stop
      - name: Apply the update and verify full first-launch startup
        shell: pwsh
        run: |
          $root = '${{ runner.temp }}/startup-verify/Hmoob VoiceLab'
          Copy-Item -LiteralPath 'hmoob-voicelab/bootstrap.py' -Destination (Join-Path $root 'hmoob-voicelab/bootstrap.py')
          python -c "import sys;from pathlib import Path;sys.path.insert(0,'hmoob-voicelab/packaging');from build_windows import write_launcher;write_launcher(Path(r'$root'))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python hmoob-voicelab/packaging/check_startup.py "$root" --reports '${{ runner.temp }}/startup-reports' --model-dir '${{ runner.temp }}/startup-models' --timeout 1200
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Create the small update without runtime, models or user data
        run: python hmoob-voicelab/packaging/build_hotfix.py --output '${{ runner.temp }}/startup-update' --archive '${{ runner.temp }}/Hmoob-VoiceLab-startup-update.zip'
      - name: Scan the actual update files and ZIP with Defender
        shell: pwsh
        timeout-minutes: 10
        run: ./hmoob-voicelab/packaging/scan_portable.ps1 -PackageRoot '${{ runner.temp }}/startup-update' -Archive '${{ runner.temp }}/Hmoob-VoiceLab-startup-update.zip' -ReportDirectory '${{ runner.temp }}/startup-reports/defender'
      - name: Upload the tested small update
        uses: actions/upload-artifact@v4
        with:
          name: Hmoob-VoiceLab-startup-update
          path: ${{ runner.temp }}/startup-update/
          if-no-files-found: error
          retention-days: 30
      - name: Keep full first-launch and update scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hmoob-VoiceLab-startup-validation
          path: ${{ runner.temp }}/startup-reports/
          if-no-files-found: warn
          retention-days: 30
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: x64
          cache: pip
          cache-dependency-path: hmoob-voicelab/requirements-voice.txt
      - name: Validate Defender gate PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'hmoob-voicelab/packaging/scan_portable.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { $parseErrors | Format-List; exit 1 }
      - name: Install tested CPU inference dependencies
        run: |
          python -m pip uninstall -y pipx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r hmoob-voicelab/requirements-voice.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare verified FFmpeg for native regressions
        run: |
          python -c "import sys;from pathlib import Path;sys.path.insert(0,'hmoob-voicelab/packaging');from build_windows import download_verified_ffmpeg;download_verified_ffmpeg(Path(r'${{ runner.temp }}/regression-ffmpeg'),Path(r'${{ runner.temp }}/ffmpeg-downloads'))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -Path $env:GITHUB_PATH -Value '${{ runner.temp }}/regression-ffmpeg/bin'
      - name: Run native application and packaging regression checks
        working-directory: hmoob-voicelab
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s packaging -p test_*.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check web/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build portable runtime and exercise real voices after relocation
        run: python hmoob-voicelab/packaging/build_windows.py --output '${{ runner.temp }}/voicelab-portable/Hmoob VoiceLab' --reports '${{ runner.temp }}/voicelab-reports'
      - name: Scan actual extracted package and ZIP with Windows Defender
        shell: pwsh
        timeout-minutes: 20
        run: ./hmoob-voicelab/packaging/scan_portable.ps1 -PackageRoot '${{ runner.temp }}/voicelab-portable/Hmoob VoiceLab' -Archive '${{ runner.temp }}/voicelab-portable/Hmoob-VoiceLab-Windows-x64.zip' -ReportDirectory '${{ runner.temp }}/voicelab-reports/defender'
      - name: Upload tested Windows tool
        uses: actions/upload-artifact@v4
        with:
          name: Hmoob-VoiceLab-Windows-x64
          path: |
            ${{ runner.temp }}/voicelab-portable/Hmoob-VoiceLab-Windows-x64.zip
            ${{ runner.temp }}/voicelab-portable/Hmoob-VoiceLab-Windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Keep build, real inference and Defender reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hmoob-VoiceLab-validation-reports
          path: |
            ${{ runner.temp }}/voicelab-reports/*.json
            ${{ runner.temp }}/voicelab-reports/*.log
            ${{ runner.temp }}/voicelab-reports/defender/
          if-no-files-found: warn
          retention-days: 30
