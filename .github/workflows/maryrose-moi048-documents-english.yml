name: Mary Rose MOI048 documents and English 21m42s
on:
  push:
    branches: [codex/maryrose-moi048-production-20261120]
    paths: [.github/workflows/maryrose-moi048-documents-english.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  documents:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: maryrose-moi048
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python maryrose-moi048/extract_content.py
          python maryrose-moi048/build_documents.py
          python -u maryrose-moi048/publish_documents.py
        env:
          GH_TOKEN: ${{ github.token }}
  english:
    needs: documents
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: maryrose-moi048
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python maryrose-moi048/extract_content.py
          python maryrose-moi048/build_documents.py
          python maryrose-moi048/english_gate.py
          python -m pip install imageio-ffmpeg==0.6.0 edge-tts==7.3.1
          python maryrose-moi048/ensure_ffmpeg.py
          python maryrose-moi048/bootstrap_tool.py online
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: maryrose-moi048-checkpoint-en-US
          path: maryrose-moi048/voice/audio/en-US
      - name: Generate English with same Andrew voice and retain completed speech
        run: |
          set +e
          python -u maryrose-moi048/render_english_groups.py
          code=$?
          if [ "$code" = 75 ]; then
            sleep 15
            python -u maryrose-moi048/render_english_groups.py
            code=$?
          fi
          exit "$code"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maryrose-moi048-checkpoint-en-US
          path: |
            maryrose-moi048/voice/audio/en-US/group-*
            maryrose-moi048/voice/audio/en-US/raw-*
            maryrose-moi048/voice/audio/en-US/fallback-*
            maryrose-moi048/voice/audio/en-US/pending_*.json
          if-no-files-found: ignore
          retention-days: 30
          overwrite: true
      - uses: actions/upload-artifact@v4
        with:
          name: maryrose-moi048-voice-en-US
          path: |
            maryrose-moi048/voice/audio/en-US/*.mp3
            maryrose-moi048/voice/audio/en-US/render_report.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true
      - name: Publish complete English narration
        run: gh release upload maryrose-moi-048-21m42s maryrose-moi048/voice/audio/en-US/*.mp3 --repo seotro95/seotro --clobber
        env:
          GH_TOKEN: ${{ github.token }}

