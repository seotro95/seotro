name: Verify and release Melo + Viet Studio
on:
  push:
    branches: [codex/melo-viet-local]
    paths: ['melo-viet-local/**', 'release-melo-viet/**', '.github/workflows/release-melo-viet.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: standalone-melo-viet
  cancel-in-progress: false
jobs:
  logic:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install pytest numpy soundfile
      - name: Ensure audio processing dependency
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - run: python -m pytest -q melo-viet-local/tests --junitxml="$RUNNER_TEMP/tests.xml"
      - name: Report test failures as structured annotations
        if: failure()
        run: |
          python - <<'PYTEST_REPORT'
          import os,xml.etree.ElementTree as E
          from pathlib import Path
          path=Path(os.environ['RUNNER_TEMP'],'tests.xml')
          if path.exists():
              for failure in E.parse(path).iter('failure'):
                  msg=(failure.text or '')[-3500:].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
                  print('::error title=Python regression::'+msg)
          PYTEST_REPORT
      - run: node --check melo-viet-local/app.js
      - run: bash -n melo-viet-local/setup.sh melo-viet-local/start.sh
      - run: python release-melo-viet/verify_package.py
      - name: Browser import, multi-voice batch, history, export and large editor
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" playwright@1.58.2
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser/node_modules/playwright" TEST_PYTHON=python node melo-viet-local/tests/browser.cjs
  windows-launcher:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Distro discovery and install, update, online-only modes in PowerShell 5.1
        shell: powershell
        run: '& ./melo-viet-local/tests/test_launcher.ps1'
  real-models:
    needs: logic
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      MELO_VIET_ROOT: /tmp/melo-viet-installed
      HF_HUB_DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: |
            /tmp/melo-viet-installed/models
            ~/.cache/pip
            ~/nltk_data
          key: melo-viet-public-models-${{ github.run_id }}
          restore-keys: melo-viet-public-models-
      - name: Test small online-only install and update without deleting user data
        run: |
          bash melo-viet-local/setup.sh --online-only
          printf 'keep\n' > "$MELO_VIET_ROOT/outputs/update-sentinel.txt"
          printf 'keep\n' > "$MELO_VIET_ROOT/models/update-sentinel.txt"
          bash melo-viet-local/setup.sh --update
          test -f "$MELO_VIET_ROOT/outputs/update-sentinel.txt"
          test -f "$MELO_VIET_ROOT/models/update-sentinel.txt"
          test ! -d "$MELO_VIET_ROOT/envs/melo"
          test ! -d "$MELO_VIET_ROOT/envs/viet"
      - name: Install the full CPU edition on Ubuntu 22.04
        run: bash melo-viet-local/setup.sh
      - name: Generate real public samples in all seven local languages
        run: |
          mkdir -p "$RUNNER_TEMP/model-qa"
          python3 melo-viet-local/check_models.py --root "$MELO_VIET_ROOT" --output "$RUNNER_TEMP/model-qa"
          mv "$RUNNER_TEMP/model-qa/MODEL-QA.json" "$RUNNER_TEMP/model-qa/MODEL-QA-1.1.0.json"
      - name: Verify the real chunk pipeline and fresh versus cached output
        run: python3 melo-viet-local/check_studio.py --root "$MELO_VIET_ROOT" --output "$RUNNER_TEMP/model-qa"
      - name: Record live online service availability and public multilingual samples
        run: python3 melo-viet-local/check_online.py --root "$MELO_VIET_ROOT" --output "$RUNNER_TEMP/model-qa"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            /tmp/melo-viet-installed/models
            ~/.cache/pip
            ~/nltk_data
          key: melo-viet-public-models-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: studio-real-model-qa
          path: ${{ runner.temp }}/model-qa/*
          retention-days: 3
  publish:
    needs: [logic, windows-launcher, real-models]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python release-melo-viet/verify_package.py
      - uses: actions/download-artifact@v4
        with:
          name: studio-real-model-qa
          path: ${{ runner.temp }}/model-qa
      - name: Upload reviewed installer and actual QA records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-assets"
          cp release-melo-viet/package.zip "$RUNNER_TEMP/release-assets/Melo-Viet-Studio-1.1.0-Windows.zip"
          cp release-melo-viet/package.sha256 "$RUNNER_TEMP/release-assets/Melo-Viet-Studio-1.1.0-Windows.zip.sha256"
          cp "$RUNNER_TEMP/model-qa/"*.json "$RUNNER_TEMP/release-assets/"
          cp "$RUNNER_TEMP/model-qa/VI-1.wav" "$RUNNER_TEMP/release-assets/SAMPLE-VI.wav"
          cp "$RUNNER_TEMP/model-qa/FR-1.wav" "$RUNNER_TEMP/release-assets/SAMPLE-FR.wav"
          gh release upload melo-viet-studio-1.1.0 "$RUNNER_TEMP"/release-assets/* --repo seotro95/seotro --clobber
      - name: Verify hosted bytes and publish with live service status
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ASSETS: ${{ runner.temp }}/release-assets
        run: |
          python release-melo-viet/verify_remote.py
          python release-melo-viet/notes_with_qa.py
          gh release edit melo-viet-studio-1.1.0 --repo seotro95/seotro --notes-file "$RUNNER_TEMP/release-notes.md" --draft=false --latest=false --target "$GITHUB_SHA"
