name: Test standalone MeloTTS and Vietnamese CPU installer
on:
  push:
    branches: [codex/melo-viet-local]
    paths: ['melo-viet-local/**', 'release-melo-viet/**', '.github/workflows/release-melo-viet.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: standalone-melo-viet
  cancel-in-progress: false
jobs:
  logic:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install pytest numpy soundfile
      - run: python -m pytest -q melo-viet-local/tests
      - run: node --check melo-viet-local/app.js
      - run: bash -n melo-viet-local/setup.sh melo-viet-local/start.sh
      - run: python release-melo-viet/verify_package.py
  windows-launcher:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Exercise distro selection and errors on Windows PowerShell 5.1
        shell: powershell
        run: '& ./melo-viet-local/tests/test_launcher.ps1'
  publish:
    needs: [logic, windows-launcher]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python release-melo-viet/verify_package.py
      - name: Upload fixed launcher and earlier model QA with provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-assets"
          cp release-melo-viet/package.zip "$RUNNER_TEMP/release-assets/MeloTTS-VieNeu-Turbo-Cai-Rieng-Windows-1.0.1.zip"
          cp release-melo-viet/package.sha256 "$RUNNER_TEMP/release-assets/MeloTTS-VieNeu-Turbo-Cai-Rieng-Windows-1.0.1.zip.sha256"
          cp release-melo-viet/MODEL-QA-1.0.0.json "$RUNNER_TEMP/release-assets/MODEL-QA-1.0.0.json"
          gh release upload melo-viet-local-1.0.1 "$RUNNER_TEMP"/release-assets/* --repo seotro95/seotro --clobber
      - name: Verify release bytes and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ASSETS: ${{ runner.temp }}/release-assets
        run: |
          python release-melo-viet/verify_remote.py
          gh release edit melo-viet-local-1.0.1 --repo seotro95/seotro --draft=false --latest=false --target "$GITHUB_SHA"
