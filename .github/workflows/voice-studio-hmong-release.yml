name: Build and publish Voice Studio Hmong 1.5.0

on:
  push:
    branches: [release/voice-studio-hmong-1.5.0]
    paths:
      - .github/workflows/voice-studio-hmong-release.yml
      - voice-studio/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voice-studio-hmong-1.5.0-release
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  PYTHONUNBUFFERED: '1'
  HF_HUB_DISABLE_XET: '1'
  GH_REPO: ${{ github.repository }}
  RELEASE_TAG: voice-studio-hmong-1.5.0

jobs:
  native-windows-release:
    if: github.repository == 'seotro95/seotro'
    runs-on: windows-2022
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: x64
          cache: pip
          cache-dependency-path: voice-studio/requirements-hmong.txt
      - name: Prepare the separate Hmong draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releases = gh api "repos/$env:GH_REPO/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $release = $releases | Where-Object { $_.tag_name -eq $env:RELEASE_TAG }
          if ($release -and -not $release.draft) { throw 'This Hmong release is already published; refuse to replace it.' }
          if (-not $release) {
            $notes = Join-Path $env:RUNNER_TEMP 'hmong-draft-notes.txt'
            'Building and validating a clean native Windows Hmong package. Download links appear after all checks pass.' | Set-Content -Encoding utf8 $notes
            gh release create $env:RELEASE_TAG --repo $env:GH_REPO --target $env:GITHUB_SHA --draft --prerelease --title 'Voice Studio Hmong 1.5.0 — Windows x64' --notes-file $notes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Install CPU runtime and Hmong dependencies
        run: |
          python voice-studio/packaging/ci_checked.py python -m pip uninstall -y pipx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python voice-studio/packaging/ci_checked.py python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python voice-studio/packaging/ci_checked.py python -m pip install torch==2.8.0+cpu torchaudio==2.8.0+cpu --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python voice-studio/packaging/ci_checked.py python -m pip install -r voice-studio/requirements-hmong.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python voice-studio/packaging/ci_checked.py python -m pip install pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python voice-studio/packaging/ci_checked.py python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare verified FFmpeg for regression checks
        run: |
          python -c "import sys; from pathlib import Path; sys.path.insert(0, 'voice-studio/packaging'); from build_windows import download_verified_ffmpeg; download_verified_ffmpeg(Path(r'${{ runner.temp }}/hmong-tools/ffmpeg'), Path(r'${{ runner.temp }}/hmong-portable/downloads'))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          '${{ runner.temp }}/hmong-tools/ffmpeg/bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Check Hmong routing and portable packaging
        working-directory: voice-studio
        run: |
          python packaging/ci_checked.py python -m pytest tests/test_hmong_native.py tests/test_prepare_hmong_native.py tests/test_hmong_native_integration.py tests/test_hmong_variant.py tests/test_hmong_reference.py tests/test_hmong_default_replacement.py tests/test_hmong_packaging.py tests/test_hmong_startup.py tests/test_hmong_text.py tests/test_hmong_inference_contract.py tests/test_hmong_narration.py tests/test_hmong_expression.py tests/test_hmong_context.py tests/test_hmong_throughput.py tests/test_hmong_acceleration.py tests/test_hmong_resume_exports.py tests/test_hmong_ui.py tests/test_portable_launcher.py tests/test_launch_setup.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check static/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check static/workspace.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and synthesize with the relocated Windows runtime
        run: |
          python voice-studio/packaging/ci_checked.py python voice-studio/packaging/build_hmong_windows.py --output '${{ runner.temp }}/hmong-portable/Voice-Studio-Hmong-1.5.0' --reports '${{ runner.temp }}/hmong-reports'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Scan the fresh package with Windows Defender when available
        timeout-minutes: 25
        run: |
          $scanner = Join-Path $env:ProgramFiles 'Windows Defender/MpCmdRun.exe'
          $report = @{ available = (Test-Path $scanner); scan_passed = $false }
          if ($report.available) {
            & $scanner -Scan -ScanType 3 -File '${{ runner.temp }}/hmong-portable/Voice-Studio-Hmong-1.5.0'
            if ($LASTEXITCODE -ne 0) { throw 'Windows Defender did not accept the fresh Hmong directory; do not publish.' }
            & $scanner -Scan -ScanType 3 -File '${{ runner.temp }}/hmong-portable/Voice-Studio-Hmong-1.5.0-Windows-x64.zip'
            if ($LASTEXITCODE -ne 0) { throw 'Windows Defender did not accept the Hmong archive; do not publish.' }
            $report.scan_passed = $true
          } else { Write-Warning 'Windows Defender command-line scanner is unavailable on this runner; no antivirus result is claimed.' }
          $report | ConvertTo-Json | Set-Content -Encoding utf8 '${{ runner.temp }}/hmong-reports/defender.json'
      - name: Retain the checked package and reports
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Voice-Studio-Hmong-1.5.0-native-windows
          compression-level: 0
          retention-days: 7
          path: |
            ${{ runner.temp }}/hmong-portable/Voice-Studio-Hmong-1.5.0-Windows-x64.zip
            ${{ runner.temp }}/hmong-portable/Voice-Studio-Hmong-1.5.0-Windows-x64.zip.sha256
            ${{ runner.temp }}/hmong-reports/*.json
            ${{ runner.temp }}/hmong-reports/Hmong-female-2-preview.mp3
            ${{ runner.temp }}/hmong-reports/Hmong-male-2-preview.mp3
      - name: Upload checked assets and publish the Hmong prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releases = gh api "repos/$env:GH_REPO/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $release = $releases | Where-Object { $_.tag_name -eq $env:RELEASE_TAG }
          if (-not $release -or -not $release.draft) { throw 'The separate Hmong draft release is missing or was published elsewhere.' }
          $zip = '${{ runner.temp }}/hmong-portable/Voice-Studio-Hmong-1.5.0-Windows-x64.zip'
          $size = (Get-Item $zip).Length
          if ($size -ge 2GB) { throw 'The package exceeds the GitHub per-asset size limit.' }
          $digest = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          $previews = @('${{ runner.temp }}/hmong-reports/Hmong-female-2-preview.mp3', '${{ runner.temp }}/hmong-reports/Hmong-male-2-preview.mp3')
          foreach ($preview in $previews) {
            if (-not (Test-Path $preview) -or (Get-Item $preview).Length -le 1000) { throw 'A generated audition MP3 is missing; do not publish.' }
          }
          $notes = Join-Path $env:RUNNER_TEMP 'hmong-release-notes.md'
          @"
          Voice Studio Hmong 1.5.0 cho Windows x64: thêm lựa chọn đọc Hmong bằng VITS + chuyển âm sắc OpenVoice V2; gắn WavMark với đoạn đủ dài, chưa chứng nhận dấu nhận diện sau nén MP3. Giữ hai giọng nam/nữ từ MP3 bạn gửi, nhân bản từ mẫu, biểu cảm cục bộ, nhập TXT/SRT và xuất WAV/MP3/TXT/SRT. Bộ F5 16 bước FP32 vẫn có trong cùng tool.

          **Tải ZIP bên dưới, giải nén toàn bộ rồi mở MO_HMONG_NHANH.bat để dùng bộ nhanh.** Mở MO_VOICE_STUDIO_HMONG.bat để dùng F5 như phiên bản trước. Đã kèm Python, thư viện CPU và FFmpeg; không cần API key hoặc tự cài Python hệ thống.

          **Bản nghe thử do bộ nhanh tạo:** [Giọng nữ](https://github.com/$env:GH_REPO/releases/download/$env:RELEASE_TAG/Hmong-female-2-preview.mp3) và [Giọng nam](https://github.com/$env:GH_REPO/releases/download/$env:RELEASE_TAG/Hmong-male-2-preview.mp3). Hai bản đọc nội dung mới có đủ ua/thaj/qab/faib/rov/ris; bản nam có hai đoạn warm/serious và khoảng nghỉ chủ động. Các tệp này dùng VITS/OpenVoice, không dùng số bước F5. Nội dung, backend thật, SHA256 và thời gian đo cả tạo giọng, đổi âm sắc, gắn WavMark khi đoạn đủ dài, xử lý biểu cảm, xuất MP3 nằm trong native-smoke.json.

          **Chưa có người nghe xác nhận phát âm đúng sáu từ hoặc độ giống giọng. Chưa xác minh mục tiêu một giờ lời đọc trong hai phút (30x).** Đoạn thử ngắn không chứng minh tốc độ cho một giờ âm thanh. Báo cáo tốc độ loại khoảng lặng tool chèn thêm; thời gian riêng suy luận và thời gian toàn quy trình được ghi rõ. Tốc độ phụ thuộc CPU/GPU.

          **Lần đầu cần Internet:** bộ nhanh tải và kiểm tra khoảng 580 MB; F5 khoảng 1,4 GB. Chỉ cần chuẩn bị bộ bạn chọn. Model không kèm ZIP; tool tải trực tiếp các tệp cố định revision/SHA256 từ nguồn trong model-sources.json. Giấy phép mã nguồn MIT được kèm; hãy xem điều khoản riêng của model upstream trước khi dùng. Chuẩn bị xong có thể tạo giọng ngoại tuyến. Dữ liệu ở voice-studio-hmong/.data; sao lưu khi cập nhật.

          Hai MP3 nguồn mới nhất giữ nguyên, nhận diện bằng SHA256 và chọn đoạn tham chiếu theo manifest. Lời Hmong của từng đoạn mẫu do bạn cung cấp và xác nhận khớp bản thu. Tool điền lời khi nhập lại MP3 nguồn, giữ lời bạn sửa. Với tệp khác, chọn đoạn 3–8 giây, nhập lời khớp và xác nhận quyền dùng giọng.

          Mặc định kể chuyện, warm 65%, giữ ngữ cảnh cụm/câu và tắt nhịp tự động. Neutral/warm/joyful/sad/serious/suspense dùng xử lý tốc độ giữ cao độ, âm lượng, đường bao và khoảng nghỉ cục bộ; chưa phải mô hình điều khiển cảm xúc thần kinh. F5 vẫn mặc định 16 bước FP32, có bản nháp 4 bước và mức 8/16/32 để so sánh. Bộ nhanh không áp dụng INT8 hoặc số bước F5. Chưa có nhận dạng lời Hmong tự động; dùng TXT/SRT hoặc sửa phụ đề thủ công.

          Kiểm thử Windows x64 dùng đúng Python đóng gói sau khi chuyển sang đường dẫn có dấu cách: tạo thật bằng bộ nhanh cho cả hai preset, nhân bản từ cả hai MP3 nguồn và đoạn cắt thủ công, hai kiểu biểu cảm, TXT/SRT/MP3, launcher nhanh và 12 đường dẫn BAT qua cmd.exe. Quy trình riêng kiểm tra F5 thật ở 16 bước FP32 và launcher thông thường. Gói ZIP được loại toàn bộ model, hồ sơ và lịch sử QA trước phát hành; kiểm tra offline phải báo thiếu model mà không tự tải.

          **Tùy chọn NVIDIA:** install_hmong_cuda.bat tải thư viện CUDA riêng nếu có GPU/driver tương thích. Kiểm thử phát hành chỉ chạy CPU; hai alias CUDA được kiểm tra với --check, không cài CUDA. Có bộ cài không chứng minh suy luận GPU hoặc đạt 30x.

          ZIP: $size bytes
          SHA256: $digest
          Commit: $env:GITHUB_SHA
          Kiểm tra: https://github.com/$env:GH_REPO/actions/runs/$env:GITHUB_RUN_ID
          "@ | Set-Content -Encoding utf8 $notes
          gh release upload $env:RELEASE_TAG $zip "$zip.sha256" '${{ runner.temp }}/hmong-reports/native-smoke.json' '${{ runner.temp }}/hmong-reports/f5-smoke.json' '${{ runner.temp }}/hmong-reports/model-sources.json' '${{ runner.temp }}/hmong-reports/build.json' $previews --repo $env:GH_REPO --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $uploaded = gh api "repos/$env:GH_REPO/releases/$($release.id)/assets" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $asset = $uploaded | Where-Object { $_.name -eq (Split-Path -Leaf $zip) }
          if (-not $asset -or $asset.size -ne $size) { throw 'The uploaded ZIP size does not match the validated archive.' }
          if ($asset.digest -and $asset.digest -ne "sha256:$digest") { throw 'The uploaded ZIP digest does not match the validated archive.' }
          foreach ($preview in $previews) {
            $previewAsset = $uploaded | Where-Object { $_.name -eq (Split-Path -Leaf $preview) }
            $previewDigest = (Get-FileHash -Algorithm SHA256 $preview).Hash.ToLowerInvariant()
            if (-not $previewAsset -or $previewAsset.size -ne (Get-Item $preview).Length) { throw 'An uploaded generated audition MP3 is missing or its size differs.' }
            if ($previewAsset.digest -and $previewAsset.digest -ne "sha256:$previewDigest") { throw 'An uploaded generated audition MP3 digest differs.' }
          }
          gh release edit $env:RELEASE_TAG --repo $env:GH_REPO --draft=false --prerelease=true --latest=false --target $env:GITHUB_SHA --title 'Voice Studio Hmong 1.5.0 — Windows x64' --notes-file $notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "Published checked Hmong ZIP ($size bytes), SHA256: $digest" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
