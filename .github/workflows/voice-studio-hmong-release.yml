name: Build and publish Voice Studio Hmong 1.6.2

on:
  push:
    branches: [release/voice-studio-hmong-1.6.2]
    paths:
      - .github/workflows/voice-studio-hmong-release.yml
      - voice-studio/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voice-studio-hmong-1.6.2-release
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  PYTHONUNBUFFERED: '1'
  HF_HUB_DISABLE_XET: '1'
  GH_REPO: ${{ github.repository }}
  RELEASE_TAG: voice-studio-hmong-1.6.2

jobs:
  windows-integrity:
    if: github.repository == 'seotro95/seotro'
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
        working-directory: voice-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Install the small verification test runner
        run: |
          python -m pip install pytest==8.4.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check real Windows model mutation detection
        run: |
          python packaging/ci_checked.py python -m pytest tests/test_prepare_hmong_native.py tests/test_windows_model_identity.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  native-windows-release:
    needs: windows-integrity
    if: github.repository == 'seotro95/seotro'
    runs-on: windows-2022
    timeout-minutes: 100
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Prepare browser QA outside the portable runtime
        run: |
          $qa = Join-Path $env:RUNNER_TEMP 'hmong-browser-qa'
          python -m venv $qa
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $qaPython = Join-Path $qa 'Scripts/python.exe'
          & $qaPython -m pip install playwright==1.56.0 pytest==8.4.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "HMOOB_BROWSER_PYTHON=$qaPython" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # Browser QA uses Edge/Chrome already installed on windows-2022.
          # Its interpreter and Playwright never enter the user ZIP.
      - name: Prepare the separate Hmong draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releases = gh api "repos/$env:GH_REPO/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $release = $releases | Where-Object { $_.tag_name -eq $env:RELEASE_TAG }
          if ($release -and -not $release.draft) { throw 'This Hmong release is already published; refuse to replace it.' }
          if (-not $release) {
            $notes = Join-Path $env:RUNNER_TEMP 'hmong-draft-notes.txt'
            'Building and validating a clean native Windows Hmong package. Download links appear after all checks pass.' | Set-Content -Encoding utf8 $notes
            gh release create $env:RELEASE_TAG --repo $env:GH_REPO --target $env:GITHUB_SHA --draft --prerelease --title 'Voice Studio Hmong 1.6.2 — Windows x64' --notes-file $notes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Restore the pinned public CPU runtime archive
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hmong-download/Voice-Studio-Hmong-1.6.1-Windows-x64.zip
          key: voice-studio-hmong-base-windows-656430126fac0d5b8d15b0d41d70c3d5ef547204eed7915d1864cc558acbfa34
      - name: Reuse checksum-verified Python, CPU dependencies and FFmpeg
        run: |
          $env:HMONG_BASE = Join-Path $env:RUNNER_TEMP 'hmong-base/Voice-Studio-Hmong-1.6.1'
          "HMONG_BASE=$env:HMONG_BASE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $downloads = Join-Path $env:RUNNER_TEMP 'hmong-download'
          New-Item -ItemType Directory -Force $downloads | Out-Null
          $archive = Join-Path $downloads 'Voice-Studio-Hmong-1.6.1-Windows-x64.zip'
          if (-not (Test-Path $archive)) {
            Invoke-WebRequest 'https://github.com/seotro95/seotro/releases/download/voice-studio-hmong-1.6.1/Voice-Studio-Hmong-1.6.1-Windows-x64.zip' -OutFile $archive
          }
          if ((Get-Item $archive).Length -ne 1193296854) { throw 'Pinned runtime archive size differs; do not execute it.' }
          $digest = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($digest -ne '656430126fac0d5b8d15b0d41d70c3d5ef547204eed7915d1864cc558acbfa34') { throw 'Pinned runtime SHA256 differs; do not execute it.' }
          Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $env:RUNNER_TEMP 'hmong-base')
          Join-Path $env:HMONG_BASE 'runtime' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Join-Path $env:HMONG_BASE 'ffmpeg/bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify the reused runtime without changing its dependencies
        run: |
          python -c "import sys; from pathlib import Path; assert Path(sys.executable).resolve() == Path(r'$env:HMONG_BASE/runtime/python.exe').resolve(); assert sys.version_info[:3] == (3, 12, 10)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python voice-studio/packaging/ci_checked.py python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python voice-studio/packaging/ci_checked.py python -m pip install --dry-run --no-index -r voice-studio/requirements-hmong.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python voice-studio/packaging/ci_checked.py python -m pytest --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check Hmong routing and portable packaging
        working-directory: voice-studio
        run: |
          python packaging/ci_checked.py python -m pytest tests/test_hmong_native.py tests/test_prepare_hmong_native.py tests/test_model_download_recovery.py tests/test_voice_errors.py tests/test_speech_validation_feedback.py tests/test_voice_click_recovery.py tests/test_hmong_health.py tests/test_hmong_repair_launcher.py tests/test_hmong_native_integration.py tests/test_hmong_variant.py tests/test_hmong_reference.py tests/test_hmong_default_replacement.py tests/test_hmong_packaging.py tests/test_hmong_patch.py tests/test_hmong_startup.py tests/test_hmong_text.py tests/test_hmong_inference_contract.py tests/test_hmong_narration.py tests/test_hmong_expression.py tests/test_hmong_context.py tests/test_hmong_throughput.py tests/test_hmong_acceleration.py tests/test_hmong_resume_exports.py tests/test_hmong_ui.py tests/test_character_cast.py tests/test_longform_chapters.py tests/test_hmong_features_api.py tests/test_longform_ui.py tests/test_character_ui.py tests/test_reference_quality.py tests/test_portable_launcher.py tests/test_runtime_instance.py tests/test_runtime_instance_integration.py tests/test_launch_setup.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check static/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check static/workspace.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check static/video-editor.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check static/direct-video.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require browser click and startup recovery regressions
        working-directory: voice-studio
        env:
          HMOOB_BROWSER_CHANNEL: msedge
        run: |
          & $env:HMOOB_BROWSER_PYTHON packaging/ci_checked.py $env:HMOOB_BROWSER_PYTHON -m pytest tests/test_voice_click_recovery.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require empty-data first-run setup, real diagnostic voices and relocated Windows synthesis
        run: |
          python voice-studio/packaging/ci_checked.py python voice-studio/packaging/build_hmong_windows.py --output '${{ runner.temp }}/hmong-portable/Voice-Studio-Hmong-1.6.2' --reports '${{ runner.temp }}/hmong-reports' --runtime-source "$env:HMONG_BASE/runtime" --ffmpeg-source "$env:HMONG_BASE/ffmpeg"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require fresh setup, real runtime math, diagnostic speech and browser results inside the single ZIP
        run: |
          python voice-studio/packaging/ci_checked.py python voice-studio/packaging/build_hmong_windows.py --validate-archive '${{ runner.temp }}/hmong-portable/Voice-Studio-Hmong-1.6.2-Windows-x64.zip'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Scan the fresh package with Windows Defender when available
        timeout-minutes: 25
        run: |
          $scanner = Join-Path $env:ProgramFiles 'Windows Defender/MpCmdRun.exe'
          $report = @{ available = (Test-Path $scanner); scan_passed = $false }
          if ($report.available) {
            & $scanner -Scan -ScanType 3 -File '${{ runner.temp }}/hmong-portable/Voice-Studio-Hmong-1.6.2'
            if ($LASTEXITCODE -ne 0) { throw 'Windows Defender did not accept the fresh Hmong directory; do not publish.' }
            & $scanner -Scan -ScanType 3 -File '${{ runner.temp }}/hmong-portable/Voice-Studio-Hmong-1.6.2-Windows-x64.zip'
            if ($LASTEXITCODE -ne 0) { throw 'Windows Defender did not accept the Hmong archive; do not publish.' }
            $report.scan_passed = $true
          } else { Write-Warning 'Windows Defender command-line scanner is unavailable on this runner; no antivirus result is claimed.' }
          $report | ConvertTo-Json | Set-Content -Encoding utf8 '${{ runner.temp }}/hmong-reports/defender.json'
      - name: Retain Windows QA reports and the package when built
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Voice-Studio-Hmong-1.6.2-native-windows
          compression-level: 0
          retention-days: 7
          path: |
            ${{ runner.temp }}/hmong-portable/Voice-Studio-Hmong-1.6.2-Windows-x64.zip
            ${{ runner.temp }}/hmong-portable/Voice-Studio-Hmong-1.6.2-Windows-x64.zip.sha256
            ${{ runner.temp }}/hmong-reports/*.json
            ${{ runner.temp }}/hmong-reports/Hmong-female-2-preview.mp3
            ${{ runner.temp }}/hmong-reports/Hmong-male-2-preview.mp3
            ${{ runner.temp }}/hmong-reports/first-run-male.wav
            ${{ runner.temp }}/hmong-reports/first-run-female.wav
      - name: Upload the single checked Windows ZIP and publish the Hmong prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releases = gh api "repos/$env:GH_REPO/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $release = $releases | Where-Object { $_.tag_name -eq $env:RELEASE_TAG }
          if (-not $release -or -not $release.draft) { throw 'The separate Hmong draft release is missing or was published elsewhere.' }
          $zip = '${{ runner.temp }}/hmong-portable/Voice-Studio-Hmong-1.6.2-Windows-x64.zip'
          python voice-studio/packaging/ci_checked.py python voice-studio/packaging/build_hmong_windows.py --validate-archive $zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $size = (Get-Item $zip).Length
          if ($size -ge 2GB) { throw 'The package exceeds the GitHub per-asset size limit.' }
          $digest = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          $notes = Join-Path $env:RUNNER_TEMP 'hmong-release-notes.md'
          @"
          **Chỉ tải một tệp:** [Voice-Studio-Hmong-1.6.2-Windows-x64.zip](https://github.com/$env:GH_REPO/releases/download/$env:RELEASE_TAG/Voice-Studio-Hmong-1.6.2-Windows-x64.zip). Giải nén toàn bộ rồi mở **MO_VOICE_STUDIO_HMONG.bat**.

          **Hướng dẫn đầy đủ:** mở HUONG-DAN-HMONG.html ở thư mục ngoài cùng hoặc bấm Hướng dẫn trong tool. Hướng dẫn gồm chạy lần đầu, tạo giọng nam/nữ, nhân bản, TXT/SRT, biểu cảm, phân vai, kịch bản dài, xuất âm thanh/video, sao lưu và xử lý lỗi.

          Bản 1.6.2 sửa trường hợp bấm Tạo giọng không thấy phản hồi: lỗi nội dung, lựa chọn hoặc chuẩn bị được hiển thị ngay cạnh nút và trong khu vực kết quả; nút mở lại để sửa lời rồi thử tiếp, giữ nguyên bản nháp. Khi tải cấu hình/danh sách giọng thất bại tạm thời, tool tự thử lại có giới hạn và có nút Thử lại. Số, URL hoặc ký tự chưa được bộ đọc hỗ trợ cần sửa thành lời Hmong muốn đọc. Giữ cơ chế CPU FP32, kiểm tra thư viện/phép tính thật và chẩn đoán giọng của bản 1.6.1. Chỉ một BAT ngoài cùng chọn VITS Hmong + OpenVoice V2. F5 16 bước FP32 và công cụ kiểm tra/CUDA giữ trong tools. Dữ liệu, lịch sử và bộ phát âm Hmong đã xác nhận được giữ nguyên.

          Quy trình Windows bắt buộc bắt đầu từ thư mục .data chưa tồn tại, không dùng mô hình/cached-data chuẩn bị sẵn: kiểm tra thiếu mô hình phải thất bại đúng, chạy phép tính thư viện thật, chuẩn bị mô hình từ nguồn chính thức, kiểm tra offline và chạy MO_VOICE_STUDIO_HMONG.bat --test-voice tạo hai WAV nam/nữ thật. Báo cáo fresh-start.json được đối chiếu SHA256, mẫu tham chiếu và tín hiệu PCM độc lập trước các lượt browser/native/F5 sau đó.

          Nếu máy của bạn chưa tạo được giọng, chạy MO_VOICE_STUDIO_HMONG.bat --test-voice trong cửa sổ lệnh. Xem voice-studio-hmong/.data/diagnostics/runtime-check.json, speech-check.json và test-male.wav/test-female.wav; giữ nguyên dữ liệu cũ để đối chiếu lỗi cụ thể.

          Nhập tối đa 1.000.000 ký tự, lập chương/phần tự động và xuất ZIP các phần WAV/MP3 kèm TXT/SRT và manifest. Giới hạn nhập không phải cam kết tạo xong một triệu ký tự trong một thời gian cố định. SRT hỗ trợ gán giọng Hmong theo từng nhân vật/cue, giữ tên nhân vật riêng với lời đọc. Bộ nhanh dùng lại tối đa 16 mẫu tham chiếu gần nhất trong RAM để giảm việc tính lại khi đổi giọng.

          Chuẩn hóa âm lượng giới hạn khuếch đại theo đỉnh tín hiệu để tránh tự tạo đỉnh bị cắt phẳng. Khi lưu mẫu, tool có chỉ dẫn về tín hiệu để chọn đoạn rõ; đây không phải điểm độ giống giọng hoặc bằng chứng mọi giọng sẽ rõ hơn.

          Giữ nút chọn Nam/Nữ đồng bộ giữa phần tạo giọng và xưởng video, khôi phục lựa chọn giọng mẫu sau bộ lọc cá nhân và giữ chữ Hmong có dấu gạch nối. Quy trình Windows bắt buộc dùng trình duyệt thật, kiểm tra POST và dấu vân tay mẫu, tạo/đọc/tải âm thanh thật, cùng kiểm tra chức năng chia phần và phân vai. Trước lượt nam đầu tiên, quy trình bấm nút thật với câu có chữ số, nhận HTTP 422 thật, xác nhận lỗi trong vùng nhìn thấy, nút mở lại và bản nháp còn nguyên, rồi sửa lời và tạo/phát/tải WAV thật. Báo cáo click_recovery trong browser-smoke.json nối lượt lỗi với đúng tác vụ nam đã hoàn tất; báo cáo nằm trong reports của ZIP.

          Giữ hai giọng mẫu nam/nữ cuối cùng do bạn gửi, nhân bản từ mẫu, kể chuyện/biểu cảm, nhập TXT/SRT và xuất WAV/MP3/TXT/SRT. Giữ bản sửa lỗi khởi động trùng: mở lần hai dùng lại đúng máy chủ mà không ngắt tác vụ đang tạo giọng. Đã tạo âm thanh thật bằng cả bộ nhanh và F5 với Python đóng gói sau khi chuyển thư mục có dấu cách; thử trực tiếp các BAT bằng cmd.exe.

          **Tốc độ một giờ voice trong hai phút (30×) vẫn chưa đạt; không bảo đảm nhân bản giống 100%.** Giữ nguyên bộ phát âm Hmong bạn đã xác nhận. Thay đổi lần này không huấn luyện model âm học mới hoặc chứng minh độ giống giọng tốt hơn. Biểu cảm hiện dùng xử lý nhịp/âm lượng giữ cao độ, chưa phải mô hình điều khiển cảm xúc thần kinh. Phép đo loại khoảng lặng tool chèn thêm; đoạn thử ngắn không xác nhận tốc độ một giờ. Có gắn WavMark cho đoạn đủ dài, chưa chứng nhận phát hiện sau nén MP3.

          Đã kèm Python, thư viện CPU, FFmpeg và hai bản thu tham chiếu. Không cần API key hay cài Python hệ thống. Lần đầu bộ nhanh tải khoảng 580 MB mô hình cố định revision/SHA256; F5 tùy chọn cần khoảng 1,4 GB riêng. Chuẩn bị xong có thể dùng ngoại tuyến. Chưa kiểm thử suy luận CUDA hoặc tốc độ GPU.

          Báo cáo lần đầu fresh-start.json, hai WAV first-run-male.wav/first-run-female.wav, kiểm tra browser/native/F5 và hai MP3 nghe thử do tool tạo nằm trong thư mục reports của cùng ZIP; không cần tải thêm tệp phụ. BUILD.json, MODEL-SOURCES.json và NATIVE-VALIDATION.json giữ thông tin nguồn, thiết lập và kết quả kiểm tra. Trọng số model và thư mục .data của QA đã được loại khỏi gói; chỉ giữ báo cáo và âm thanh kiểm tra đã nêu.

          **Cập nhật:** giải nén vào thư mục mới, đóng tool cũ trước khi dùng. Nên chạy thử ngắn với dữ liệu trống của bản mới trước khi chép dữ liệu cũ. Giữ nguyên hoặc sao chép thư mục voice-studio-hmong/.data từ bản cũ sang cùng vị trí trong bản mới để giữ model, giọng cá nhân và lịch sử. Không xóa dữ liệu cũ. Bộ nhanh và F5 có manifest riêng; không cần tải cả hai nếu chỉ dùng một bộ.

          ZIP: $size bytes
          SHA256: $digest
          Commit: $env:GITHUB_SHA
          Kiểm tra Windows: https://github.com/$env:GH_REPO/actions/runs/$env:GITHUB_RUN_ID
          "@ | Set-Content -Encoding utf8 $notes
          gh release upload $env:RELEASE_TAG $zip --repo $env:GH_REPO --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $uploaded = @(gh api "repos/$env:GH_REPO/releases/$($release.id)/assets" | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($uploaded.Count -ne 1) { throw 'This release must expose exactly one full Windows ZIP.' }
          $asset = $uploaded[0]
          if ($asset.name -ne (Split-Path -Leaf $zip) -or $asset.size -ne $size -or $asset.digest -ne "sha256:$digest") { throw 'The only uploaded ZIP differs from the validated archive.' }
          gh release edit $env:RELEASE_TAG --repo $env:GH_REPO --draft=false --prerelease=true --latest=false --target $env:GITHUB_SHA --title 'Voice Studio Hmong 1.6.2 — một gói Windows x64' --notes-file $notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "Published one checked Hmong ZIP ($size bytes), SHA256: $digest" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
      - name: Archive and remove the superseded Hmong 1.6.0 release
        id: cleanup
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $removed = @()
          $failures = @()
          $guardPassed = $false
          try {
            if ($env:RELEASE_TAG -ne 'voice-studio-hmong-1.6.2') { throw 'Cleanup is restricted to the checked 1.6.2 publication.' }
            $published = gh api "repos/$env:GH_REPO/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Cannot verify the new public release; leave old releases untouched.' }
            if ($published.draft -or $published.tag_name -ne $env:RELEASE_TAG) { throw 'The replacement release is not public.' }
            if (@($published.assets).Count -ne 1) { throw 'The replacement release must expose exactly one validated ZIP.' }
            $checkedArchives = @('${{ runner.temp }}/hmong-portable/Voice-Studio-Hmong-1.6.2-Windows-x64.zip')
            foreach ($path in $checkedArchives) {
              $expected = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
              $assets = @($published.assets | Where-Object { $_.name -eq (Split-Path -Leaf $path) })
              if ($assets.Count -ne 1 -or $assets[0].size -ne (Get-Item $path).Length -or $assets[0].digest -ne "sha256:$expected") { throw 'The public ZIP differs from the validated asset; leave old releases untouched.' }
            }
            $guardPassed = $true
            $pages = gh api --paginate --slurp "repos/$env:GH_REPO/releases?per_page=100" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Cannot archive the release metadata; leave old releases untouched.' }
            $releases = @(foreach ($page in $pages) { foreach ($entry in $page) { $entry } })
            $obsolete = @($releases | Where-Object { $_.tag_name -match '^voice-studio-hmong-1\.6\.0$' })
            ConvertTo-Json -InputObject $obsolete -Depth 100 | Set-Content -Encoding utf8 '${{ runner.temp }}/hmong-reports/obsolete-releases.json'
            $base = @($releases | Where-Object { $_.tag_name -eq 'voice-studio-hmong-1.6.1' })
            if ($base.Count -ne 1) { throw 'The pinned 1.6.1 runtime release must remain available.' }
            $baseAssets = @($base[0].assets | Where-Object { $_.name -eq 'Voice-Studio-Hmong-1.6.1-Windows-x64.zip' })
            if ($base[0].draft -or $baseAssets.Count -ne 1 -or $baseAssets[0].size -ne 1193296854 -or $baseAssets[0].digest -ne 'sha256:656430126fac0d5b8d15b0d41d70c3d5ef547204eed7915d1864cc558acbfa34') { throw 'The pinned public 1.6.1 runtime ZIP must remain available unchanged; leave obsolete releases untouched.' }
            ConvertTo-Json -InputObject $base[0] -Depth 100 | Set-Content -Encoding utf8 '${{ runner.temp }}/hmong-reports/retained-base-release.json'
            $notice = "**Bản đang dùng: [Voice Studio Hmong 1.6.2](https://github.com/$env:GH_REPO/releases/tag/voice-studio-hmong-1.6.2).** Bản 1.6.1 chỉ được giữ làm bộ chạy nền có SHA256 cố định cho quy trình đóng gói; hãy tải bản sửa lỗi 1.6.2 để sử dụng."
            $body = [string]$base[0].body
            if (-not $body.StartsWith($notice)) { $body = $notice + [Environment]::NewLine + [Environment]::NewLine + $body }
            $baseNotes = Join-Path $env:RUNNER_TEMP 'hmong-1.6.1-archive-notes.md'
            $body | Set-Content -Encoding utf8 $baseNotes
            gh release edit voice-studio-hmong-1.6.1 --repo $env:GH_REPO --latest=false --title 'Voice Studio Hmong 1.6.1 — lưu trữ bộ chạy' --notes-file $baseNotes
            if ($LASTEXITCODE -ne 0) { throw 'Could not identify the retained runtime archive clearly; obsolete release cleanup was not started.' }
            foreach ($entry in $obsolete) {
              if ($entry.tag_name -notmatch '^voice-studio-hmong-1\.6\.0$') { throw 'Refuse deletion outside the superseded Hmong 1.6.0 release.' }
              # The release endpoint removes release assets, never Git tags or branches.
              gh api --method DELETE "repos/$env:GH_REPO/releases/$($entry.id)"
              if ($LASTEXITCODE -ne 0) { $failures += "Could not remove release $($entry.tag_name)" }
              else { $removed += $entry.tag_name }
            }
            if ($failures.Count -gt 0) { throw 'Some obsolete releases could not be removed; see the retained cleanup report.' }
          } catch {
            $failures += $_.Exception.Message
            Write-Warning 'The checked 1.6.2 release remains published; obsolete release cleanup is incomplete.'
            throw
          } finally {
            @{ checked_1_6_2_public_assets = $guardPassed; removed_release_tags = $removed; retained_runtime_release = 'voice-studio-hmong-1.6.1'; git_tags_or_branches_deleted = $false; failures = $failures } | ConvertTo-Json -Depth 10 | Set-Content -Encoding utf8 '${{ runner.temp }}/hmong-reports/release-cleanup.json'
            "Obsolete Hmong releases removed: $($removed -join ', '). Cleanup failures: $($failures.Count). The checked 1.6.2 release remains published; 1.6.1 is retained as the pinned runtime archive." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }
      - name: Retain obsolete release metadata and cleanup results
        if: always() && steps.cleanup.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Voice-Studio-Hmong-1.6.2-release-cleanup
          retention-days: 90
          path: |
            ${{ runner.temp }}/hmong-reports/obsolete-releases.json
            ${{ runner.temp }}/hmong-reports/retained-base-release.json
            ${{ runner.temp }}/hmong-reports/release-cleanup.json
