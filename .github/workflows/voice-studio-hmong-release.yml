name: Build and publish Voice Studio Hmong 1.4.0

on:
  push:
    branches: [release/voice-studio-hmong-1.4.0]
    paths:
      - .github/workflows/voice-studio-hmong-release.yml
      - voice-studio/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voice-studio-hmong-1.4.0-release
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  PYTHONUNBUFFERED: '1'
  HF_HUB_DISABLE_XET: '1'
  GH_REPO: ${{ github.repository }}
  RELEASE_TAG: voice-studio-hmong-1.4.0

jobs:
  native-windows-release:
    if: github.repository == 'seotro95/seotro'
    runs-on: windows-2022
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: x64
          cache: pip
          cache-dependency-path: voice-studio/requirements-hmong.txt
      - name: Prepare the separate Hmong draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releases = gh api "repos/$env:GH_REPO/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $release = $releases | Where-Object { $_.tag_name -eq $env:RELEASE_TAG }
          if ($release -and -not $release.draft) { throw 'This Hmong release is already published; refuse to replace it.' }
          if (-not $release) {
            $notes = Join-Path $env:RUNNER_TEMP 'hmong-draft-notes.txt'
            'Building and validating a clean native Windows Hmong package. Download links appear after all checks pass.' | Set-Content -Encoding utf8 $notes
            gh release create $env:RELEASE_TAG --repo $env:GH_REPO --target $env:GITHUB_SHA --draft --prerelease --title 'Voice Studio Hmong 1.4.0 — Windows x64' --notes-file $notes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Install CPU runtime and Hmong dependencies
        run: |
          python voice-studio/packaging/ci_checked.py python -m pip uninstall -y pipx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python voice-studio/packaging/ci_checked.py python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python voice-studio/packaging/ci_checked.py python -m pip install torch==2.8.0+cpu torchaudio==2.8.0+cpu --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python voice-studio/packaging/ci_checked.py python -m pip install -r voice-studio/requirements-hmong.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python voice-studio/packaging/ci_checked.py python -m pip install pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python voice-studio/packaging/ci_checked.py python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare verified FFmpeg for regression checks
        run: |
          python -c "import sys; from pathlib import Path; sys.path.insert(0, 'voice-studio/packaging'); from build_windows import download_verified_ffmpeg; download_verified_ffmpeg(Path(r'${{ runner.temp }}/hmong-tools/ffmpeg'), Path(r'${{ runner.temp }}/hmong-portable/downloads'))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          '${{ runner.temp }}/hmong-tools/ffmpeg/bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Check Hmong routing and portable packaging
        working-directory: voice-studio
        run: |
          python packaging/ci_checked.py python -m pytest tests/test_hmong_variant.py tests/test_hmong_reference.py tests/test_hmong_default_replacement.py tests/test_hmong_packaging.py tests/test_hmong_startup.py tests/test_hmong_text.py tests/test_hmong_inference_contract.py tests/test_hmong_narration.py tests/test_hmong_expression.py tests/test_hmong_context.py tests/test_hmong_throughput.py tests/test_hmong_acceleration.py tests/test_hmong_resume_exports.py tests/test_hmong_ui.py tests/test_portable_launcher.py tests/test_launch_setup.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check static/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check static/workspace.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and synthesize with the relocated Windows runtime
        run: |
          python voice-studio/packaging/ci_checked.py python voice-studio/packaging/build_hmong_windows.py --output '${{ runner.temp }}/hmong-portable/Voice-Studio-Hmong-1.4.0' --reports '${{ runner.temp }}/hmong-reports'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Scan the fresh package with Windows Defender when available
        timeout-minutes: 25
        run: |
          $scanner = Join-Path $env:ProgramFiles 'Windows Defender/MpCmdRun.exe'
          $report = @{ available = (Test-Path $scanner); scan_passed = $false }
          if ($report.available) {
            & $scanner -Scan -ScanType 3 -File '${{ runner.temp }}/hmong-portable/Voice-Studio-Hmong-1.4.0'
            if ($LASTEXITCODE -ne 0) { throw 'Windows Defender did not accept the fresh Hmong directory; do not publish.' }
            & $scanner -Scan -ScanType 3 -File '${{ runner.temp }}/hmong-portable/Voice-Studio-Hmong-1.4.0-Windows-x64.zip'
            if ($LASTEXITCODE -ne 0) { throw 'Windows Defender did not accept the Hmong archive; do not publish.' }
            $report.scan_passed = $true
          } else { Write-Warning 'Windows Defender command-line scanner is unavailable on this runner; no antivirus result is claimed.' }
          $report | ConvertTo-Json | Set-Content -Encoding utf8 '${{ runner.temp }}/hmong-reports/defender.json'
      - name: Retain the checked package and reports
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Voice-Studio-Hmong-1.4.0-native-windows
          compression-level: 0
          retention-days: 7
          path: |
            ${{ runner.temp }}/hmong-portable/Voice-Studio-Hmong-1.4.0-Windows-x64.zip
            ${{ runner.temp }}/hmong-portable/Voice-Studio-Hmong-1.4.0-Windows-x64.zip.sha256
            ${{ runner.temp }}/hmong-reports/*.json
            ${{ runner.temp }}/hmong-reports/Hmong-female-2-preview.mp3
            ${{ runner.temp }}/hmong-reports/Hmong-male-2-preview.mp3
      - name: Upload checked assets and publish the Hmong prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releases = gh api "repos/$env:GH_REPO/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $release = $releases | Where-Object { $_.tag_name -eq $env:RELEASE_TAG }
          if (-not $release -or -not $release.draft) { throw 'The separate Hmong draft release is missing or was published elsewhere.' }
          $zip = '${{ runner.temp }}/hmong-portable/Voice-Studio-Hmong-1.4.0-Windows-x64.zip'
          $size = (Get-Item $zip).Length
          if ($size -ge 2GB) { throw 'The package exceeds the GitHub per-asset size limit.' }
          $digest = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          $previews = @('${{ runner.temp }}/hmong-reports/Hmong-female-2-preview.mp3', '${{ runner.temp }}/hmong-reports/Hmong-male-2-preview.mp3')
          foreach ($preview in $previews) {
            if (-not (Test-Path $preview) -or (Get-Item $preview).Length -le 1000) { throw 'A generated audition MP3 is missing; do not publish.' }
          }
          $notes = Join-Path $env:RUNNER_TEMP 'hmong-release-notes.md'
          @"
          Voice Studio Hmong 1.4.0 cho Windows x64: gói nền CPU đầy đủ, hai giọng nam/nữ từ MP3 bạn gửi, nhân bản giọng, nhập TXT/SRT và xuất WAV/MP3/TXT/SRT. Mặc định giữ ngữ cảnh cụm/câu khi nhấn từ và tắt tự chèn khoảng nghỉ để giảm các lần gọi mô hình riêng lẻ.

          **Chưa xác minh phát âm đúng ua/thaj/qab/faib/rov/ris hoặc đạt 30x (một giờ lời đọc trong hai phút).** Phiên bản này giữ ngữ cảnh để bạn nghe so sánh; không tuyên bố đã sửa hoàn toàn cách mô hình đọc sáu từ đó.

          **Tải ZIP bên dưới, giải nén toàn bộ, rồi mở MO_VOICE_STUDIO_HMONG.bat.** Đã kèm Python, thư viện CPU và FFmpeg; không cần API key hoặc tự cài Python hệ thống.

          **Bản nghe thử do tool tạo:** [Giọng nữ](https://github.com/$env:GH_REPO/releases/download/$env:RELEASE_TAG/Hmong-female-2-preview.mp3) và [Giọng nam](https://github.com/$env:GH_REPO/releases/download/$env:RELEASE_TAG/Hmong-male-2-preview.mp3). Cả hai đọc nội dung mới chứa đủ ua/thaj/qab/faib/rov/ris ở 16 bước FP32, khác hai bản thu MP3 gốc. Bản nam có hai phần warm/serious và khoảng nghỉ chủ động. Có thể nghe trước khi tải ZIP; nội dung, thiết lập, SHA256 và thời gian đo nằm trong native-smoke.json. Các bản nghe thử này cần người biết Hmong đánh giá phát âm và độ giống giọng.

          **Tùy chọn NVIDIA:** nếu có GPU/driver tương thích, chủ động chạy install_hmong_cuda.bat để tải thư viện CUDA vào môi trường riêng bằng Internet. Gói ZIP nền vẫn dùng CPU. Có sẵn bộ cài CUDA không chứng minh suy luận CUDA hoạt động trên máy bạn, không phải kết quả kiểm thử GPU và không xác minh mức tăng tốc 30x. Kiểm thử Windows phát hành này chỉ chạy suy luận CPU; hai launcher CUDA chỉ được chạy với --check để kiểm tra đường dẫn, không tải/cài CUDA.

          **Lần đầu cần Internet để tự tải và kiểm tra khoảng 1,4 GB model.** Model Hmong không có giấy phép phân phối lại rõ ràng nên không kèm weights trong ZIP; tool tải trực tiếp các tệp cố định revision/SHA256 từ nguồn model. Sau khi chuẩn bị xong có thể tạo giọng ngoại tuyến. Dữ liệu nằm trong voice-studio-hmong/.data; sao lưu thư mục này khi cập nhật.

          Hai MP3 nam/nữ mới nhất bạn gửi được giữ nguyên để nghe thử, nhận diện bằng SHA256 và dùng đoạn tham chiếu theo manifest. Lời Hmong của từng đoạn mẫu do bạn cung cấp và xác nhận khớp bản thu; tool điền đúng lời này khi nhập lại MP3 nguồn và giữ lời bạn chỉnh nếu có. Với tệp khác, chọn đoạn 3–8 giây, nhập lời Hmong khớp đoạn mẫu và xác nhận quyền sử dụng giọng.

          Mặc định Tự nhiên 16 bước FP32, kể chuyện, warm 65%, giữ ngữ cảnh cụm/câu và tắt nhịp tự động. Nhấn từ áp dụng lên cả cụm chứa từ đó; chưa căn chỉnh từng từ. Có thể bật lại nhịp hoặc tự chèn khoảng nghỉ. Sáu lựa chọn neutral/warm/joyful/sad/serious/suspense dùng điều chỉnh tốc độ giữ cao độ, âm lượng, đường bao và khoảng nghỉ cục bộ; không phải mô hình huấn luyện điều khiển cảm xúc. Chế độ 4 bước là bản nháp có thể giảm độ rõ/tự nhiên; chỉ chế độ này thử INT8 trên CPU và dự phòng FP32. Các mức 8/16/32 giữ FP32 theo mặc định. Chưa hỗ trợ nhận dạng giọng nói Hmong tự động trong tool; dùng TXT/SRT hoặc sửa phụ đề thủ công.

          Báo cáo tốc độ dùng thời lượng các đoạn âm thanh có lời do mô hình tạo, loại phần khoảng lặng tool chèn thêm vào nhịp/SRT. Kết quả ngắn không chứng minh mục tiêu một giờ lời đọc trong hai phút. Tốc độ phụ thuộc CPU/GPU và mức chất lượng.

          Đã kiểm tra bằng Python Windows x64 được đóng gói sau khi chuyển sang đường dẫn có dấu cách: checksum hai MP3 nguồn, CPU tạo thật cho cả hai giọng và nhân bản từ từng MP3 ở 16 bước FP32, nội dung thử đủ sáu từ, hai mức biểu cảm cục bộ, đoạn mẫu thủ công, TXT/SRT/MP3, đo tốc độ loại khoảng lặng chèn, launcher bình thường và 11 tệp BAT qua cmd.exe. Kiểm tra này không chứng minh phát âm chuẩn, diễn xuất cảm xúc, độ giống giọng, suy luận CUDA hoặc đạt 30x.

          ZIP: $size bytes
          SHA256: $digest
          Commit: $env:GITHUB_SHA
          Kiểm tra: https://github.com/$env:GH_REPO/actions/runs/$env:GITHUB_RUN_ID
          "@ | Set-Content -Encoding utf8 $notes
          gh release upload $env:RELEASE_TAG $zip "$zip.sha256" '${{ runner.temp }}/hmong-reports/native-smoke.json' $previews --repo $env:GH_REPO --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $uploaded = gh api "repos/$env:GH_REPO/releases/$($release.id)/assets" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $asset = $uploaded | Where-Object { $_.name -eq (Split-Path -Leaf $zip) }
          if (-not $asset -or $asset.size -ne $size) { throw 'The uploaded ZIP size does not match the validated archive.' }
          if ($asset.digest -and $asset.digest -ne "sha256:$digest") { throw 'The uploaded ZIP digest does not match the validated archive.' }
          foreach ($preview in $previews) {
            $previewAsset = $uploaded | Where-Object { $_.name -eq (Split-Path -Leaf $preview) }
            $previewDigest = (Get-FileHash -Algorithm SHA256 $preview).Hash.ToLowerInvariant()
            if (-not $previewAsset -or $previewAsset.size -ne (Get-Item $preview).Length) { throw 'An uploaded generated audition MP3 is missing or its size differs.' }
            if ($previewAsset.digest -and $previewAsset.digest -ne "sha256:$previewDigest") { throw 'An uploaded generated audition MP3 digest differs.' }
          }
          gh release edit $env:RELEASE_TAG --repo $env:GH_REPO --draft=false --prerelease=true --latest=false --target $env:GITHUB_SHA --title 'Voice Studio Hmong 1.4.0 — Windows x64' --notes-file $notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "Published checked Hmong ZIP ($size bytes), SHA256: $digest" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
