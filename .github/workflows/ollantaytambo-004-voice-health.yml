name: Ollantaytambo 004 short voice health diagnostic
on:
  push:
    branches: [codex/ollantaytambo-004-production-20261117]
    paths: ['.github/workflows/ollantaytambo-004-voice-health.yml']
permissions:
  contents: read
concurrency:
  group: ollantaytambo-004-short-voice-health
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: production/ollantaytambo004
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original online dependency
        run: python -m pip install edge-tts==7.3.1
      - name: Compare native SentenceBoundary and WordBoundary for seven voices
        run: python -u production/ollantaytambo004/voice_health.py
      - name: Preserve actual diagnostic responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 004_Ollantaytambo_Short_Voice_Health
          path: outputs/voice_health/
          if-no-files-found: error
          retention-days: 7
