name: Finalize 16 aligned localized narrations
on:
  push:
    branches: [codex/siberia-2536-production]
    paths:
      - '.github/workflows/siberia-final-voices.yml'
      - 'siberia-production/curated_cues.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        language: [vi, es, fr, ja, ko, de, it, pt, nl, pl, sv, da, fi, 'no', cs, hi]
    concurrency:
      group: siberia-final-${{ matrix.language }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare the shared timeline and reviewed scientific passages
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUTF8: '1'
        run: python siberia-production/prepare_final_voice.py '${{ matrix.language }}'
      - uses: actions/checkout@v4
        with:
          ref: 4f4fa1d72d976d6e2b9c94f906b0e12c6a2cf043
          path: melo-source
          sparse-checkout: melo-viet-local
          persist-credentials: false
      - name: Install the pinned Melo CPU backend
        run: |
          python siberia-production/install_ffmpeg.py
          python -m pip install --disable-pip-version-check --timeout 45 -r melo-source/melo-viet-local/fast-lock.txt
      - name: Render and verify the final localized WAV, MP3 and SRT
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUTF8: '1'
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '2'
        run: python siberia-production/render_voice.py '${{ matrix.language }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-siberia-${{ matrix.language }}
          path: rendered/${{ matrix.language }}/
          retention-days: 7
          if-no-files-found: ignore
