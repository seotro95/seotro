name: Denisova episode6 - expressive narration, 17 locked voices
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reuse verified original English preview
        run: python -c "import json; p=json.load(open('input/REPAIR_PLAN.json')); assert p['original_preview_verified']; print('English30second preview already verified in original run',p['original_run_id'])"
  voices:
    needs: preview
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        locale: [ko-KR, it-IT, en-US, de-DE, sv-SE, ja-JP]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the pinned online client
        run: python -m pip install edge-tts==7.3.1
      - name: Restore checkpoint from this repair attempt if present
        id: restore_own
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          name: dn06-checkpoint-${{ matrix.locale }}
          path: build/voice/audio/${{ matrix.locale }}
      - name: Restore original checkpoint without resynthesizing completed chapters
        if: steps.restore_own.outcome == 'failure'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '42791520378'
          name: dn06-checkpoint-${{ matrix.locale }}
          path: build/voice/audio/${{ matrix.locale }}
      - name: Render expressive narration with the original voice ID
        timeout-minutes: 55
        env:
          TTS_CHUNK_LIMIT: '480'
          TTS_LOCALE_WORKERS: '2'
        run: python -u scripts/job_init.py ${{ matrix.locale }} full
      - name: Preserve recoverable partial work
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dn06-checkpoint-${{ matrix.locale }}
          overwrite: true
          path: |
            build/voice/audio/${{ matrix.locale }}/raw-*.wav
            build/voice/audio/${{ matrix.locale }}/raw-*.json
            build/voice/audio/${{ matrix.locale }}/raw-*.jsonl
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: dn06-voice-${{ matrix.locale }}
          path: |
            build/voice/audio/${{ matrix.locale }}/DENISOVA_06_*.mp3
            build/voice/audio/${{ matrix.locale }}/render_report.json
            build/voice/audio/${{ matrix.locale }}/subtitles.srt
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: voices
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '42791520378'
          pattern: dn06-voice-*
          path: artifacts/original
      - uses: actions/download-artifact@v4
        with:
          pattern: dn06-voice-*
          path: artifacts/repair
      - name: Verify all17 durations and identities, add native Hmong, publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u scripts/publish_voices_job.py
