name: Denisova6 inspect existing checkpoint durations
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        locale: [en-US, ko-KR, it-IT]
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '42791520378'
          name: dn06-checkpoint-${{ matrix.locale }}
          path: checkpoint
      - name: Measure all existing chapters without synthesizing speech
        env:
          LOCALE: ${{ matrix.locale }}
        run: |
          python3 - <<'PY'
          import os,pathlib,wave,re,json
          loc=os.environ['LOCALE'];totals={i:0 for i in range(1,127 if loc=='en-US' else 13)}
          for p in pathlib.Path('checkpoint').glob('*.wav'):
              m=re.fullmatch(r'raw-(\d+)-(\d+)\.wav',p.name)
              if not m:continue
              with wave.open(str(p)) as w:totals[int(m[1])]+=w.getnframes()/w.getframerate()
          result=[{'chapter':i,'raw_seconds':round(s,4),'target':10 if loc=='en-US' else 110 if i<=6 else 100,'needed_tempo':round(s/(10 if loc=='en-US' else 110 if i<=6 else 100),4)} for i,s in totals.items()]
          print('CHECKPOINT_CUE_DURATIONS='+json.dumps({'locale':os.environ['LOCALE'],'chapters':result}))
          assert all(v>0 for v in totals.values())
          PY
