name: SaqqaqHair91 repair Korean closing and publish17voices
on:
  push:
    branches: [codex/saqqaq-hair91-production-20261113]
    paths: [.github/workflows/saqqaq-hair91-repair-korean.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  korean:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: episode91
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python episode91/extract_inputs.py
      - uses: actions/download-artifact@v4
        with:
          name: saqqaq91-english-preflight
          path: preflight_english
          run-id: 43456318630
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: saqqaq91-namminh-preflight
          path: preflight_namminh
          run-id: 43456318630
          github-token: ${{ github.token }}
      - run: python episode91/preflight91.py
      - run: |
          python -m pip install imageio-ffmpeg==0.6.0 edge-tts==7.3.1
          python episode91/ensure_ffmpeg.py
          python episode91/bootstrap_tool.py online
      - uses: actions/download-artifact@v4
        with:
          name: saqqaq91-checkpoint-ko-KR
          path: episode91/voice/audio/ko-KR
          run-id: 43458603631
          github-token: ${{ github.token }}
      - name: Reuse first13chapters and synthesize revised closing with same voice
        run: python -u episode91/render_online.py ko-KR
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saqqaq91-korean-repair-checkpoint
          path: episode91/voice/audio/ko-KR/raw-*
          retention-days: 14
          overwrite: true
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: saqqaq91-voice-ko-KR
          path: |
            episode91/voice/audio/ko-KR/*.mp3
            episode91/voice/audio/ko-KR/render_report.json
          retention-days: 14
          overwrite: true
          if-no-files-found: error
  publish:
    needs: korean
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: episode91
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python episode91/extract_inputs.py
          python -m pip install imageio-ffmpeg==0.6.0
          python episode91/ensure_ffmpeg.py
      - uses: actions/download-artifact@v4
        with:
          pattern: saqqaq91-voice-*
          path: voice_artifacts
          run-id: 43458603631
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: saqqaq91-voice-ko-KR
          path: voice_artifacts/saqqaq91-voice-ko-KR
      - name: Verify17complete waveforms and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u episode91/publish_voices.py
      - uses: actions/upload-artifact@v4
        with:
          name: saqqaq91-release-reports
          path: |
            episode91/voice_delivery/*.json
            episode91/voice_delivery/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
