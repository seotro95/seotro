name: Inspect official Microsoft submission requirements

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/microsoft-submission-prerequisites.yml'
      - 'hmoob-voicelab/security/inspect_microsoft_submission.py'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect public portal without signing in or uploading files
        run: |
          python3 -m venv "$RUNNER_TEMP/ms-portal-tools"
          "$RUNNER_TEMP/ms-portal-tools/bin/python" -m pip install --disable-pip-version-check playwright==1.55.0
          "$RUNNER_TEMP/ms-portal-tools/bin/python" hmoob-voicelab/security/inspect_microsoft_submission.py
      - name: Preserve public requirement report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: microsoft-submission-prerequisites
          path: ${{ runner.temp }}/microsoft-submission-prerequisites/
          retention-days: 14
          if-no-files-found: error
