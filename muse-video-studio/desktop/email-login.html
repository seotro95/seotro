<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; form-action 'none'"><title>Đăng nhập Muse từ email</title><link rel="stylesheet" href="email-login.css"></head><body>
<h1>Mở liên kết đăng nhập từ email</h1><p>Yêu cầu email đăng nhập mới trong tab Muse. Trong email, sao chép địa chỉ liên kết và dán vào đây để mở bằng đúng phiên của tool.</p><p class="hint">Nếu liên kết đã mở trong trình duyệt khác, hãy xin email mới. Không gửi liên kết hoặc mã xác nhận vào chat.</p>
<form id="email-form"><label for="email-link">Liên kết đăng nhập Muse</label><input id="email-link" type="password" autocomplete="off" spellcheck="false" placeholder="Dán liên kết từ email" required maxlength="8192"><p id="feedback" role="status"></p><footer><button id="cancel" type="button">Đóng</button><button id="submit" type="submit">Mở trong tool</button></footer></form>
<script src="email-login.js"></script></body></html>
