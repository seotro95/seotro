# Add this section to the existing %USERPROFILE%\.codex\config.toml.
# Set MUSE_STUDIO_KEY in the environment of the local Codex process.
# If Studio uses a different API port, replace 8790 below.
[mcp_servers.muse_studio]
url = "http://127.0.0.1:8790/mcp"
bearer_token_env_var = "MUSE_STUDIO_KEY"
tool_timeout_sec = 600
